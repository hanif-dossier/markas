<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-192.png" type="image/png">
<link rel="apple-touch-icon" href="ikon-180.png">
<title>Markas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
</head>
<body>
<style>
:root{
  color-scheme: dark;
  --bg:#0B0E14; --bg-2:#0F131C;
  --panel:#131824; --panel-2:#1A2132; --panel-3:#222B3F;
  --line:#263047; --line-2:#334060;
  --text:#EEF1F6; --muted:#8C96AA; --dim:#5C667C;
  --gold:#E3B25A; --gold-2:#F5D28A; --gold-dim:rgba(227,178,90,.14);
  --teal:#63C7BF; --teal-dim:rgba(99,199,191,.14);
  --good:#48D18A; --good-dim:rgba(72,209,138,.16);
  --warn:#F0A33C; --warn-dim:rgba(240,163,60,.16);
  --bad:#EF5D6F; --bad-dim:rgba(239,93,111,.16);
  --violet:#9B8CFF;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --r:14px; --r-sm:9px;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%, rgba(227,178,90,.07), transparent 60%),radial-gradient(900px 500px at -10% 100%, rgba(99,199,191,.06), transparent 60%),var(--bg);color:var(--text);font-family:var(--sans);font-size:14.5px;line-height:1.5;min-height:100vh}
a{color:var(--gold-2)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:12.5px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--bg-2),var(--bg));display:flex;flex-direction:column;gap:6px}
.brand{padding:4px 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand .name{font-family:var(--serif);font-size:26px;line-height:1;color:var(--gold-2)}
.brand .tag{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;border:1px solid transparent}
.nav a:hover{color:var(--text);background:var(--panel)}
.nav a.on{color:var(--text);background:var(--panel-2);border-color:var(--line)}
.nav a .ic{width:18px;height:18px;flex:none;color:var(--gold);opacity:.9}
.nav a.on .ic{color:var(--gold-2)}
.rail .foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.store{display:inline-flex;align-items:center;gap:6px}
.store i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.store.cloud i{background:var(--good);box-shadow:0 0 8px var(--good)}
.store.local i{background:var(--warn)}
main{padding:26px 30px 90px;max-width:1240px;width:100%}
.tamu{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-4px 0 18px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(90deg,rgba(227,178,90,.12),transparent)}
.tamu .t{color:var(--muted);font-size:13.5px}.tamu .t b{color:var(--gold-2)}.tamu .a{display:flex;gap:8px;flex-wrap:wrap}
.masuk-tab{display:flex;gap:6px;margin-bottom:14px}.masuk-tab button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;cursor:pointer}.masuk-tab button.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-family:var(--serif);font-size:34px;line-height:1.05;font-weight:400}
.topbar h1 em{color:var(--gold-2);font-style:italic}
.topbar .sub{color:var(--muted);margin-top:6px}

/* ---------- surfaces ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.panel.tight{padding:14px 16px}
.panel h2{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel h2 .eyebrow{font-weight:700}
.panel h2 .act{font-size:12px;font-weight:600;color:var(--gold-2);cursor:pointer;background:none;border:0;padding:0}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.tile .big{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .sub{font-size:12px;color:var(--dim)}
.tile.good .big{color:var(--good)}.tile.bad .big{color:var(--bad)}.tile.gold .big{color:var(--gold-2)}.tile.teal .big{color:var(--teal)}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.05),transparent 70%)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-3)}
.btn.primary{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.btn.primary:hover{background:var(--gold-2)}
.btn.danger{background:var(--bad-dim);border-color:rgba(239,93,111,.4);color:#ffb3bb}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel-2)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.icon{padding:6px;width:30px;height:30px;justify-content:center}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;color:var(--text);font-size:13.5px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{min-height:84px;resize:vertical;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.form{display:grid;gap:10px}
.form.cols2{grid-template-columns:1fr 1fr}.form.cols3{grid-template-columns:1fr 1fr 1fr}.form.cols4{grid-template-columns:repeat(4,1fr)}
.form .full{grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;border:1px solid var(--line-2);color:var(--muted);background:var(--panel-2)}
.pill.good{color:var(--good);background:var(--good-dim);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-dim);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-dim);border-color:transparent}
.pill.gold{color:var(--gold-2);background:var(--gold-dim);border-color:transparent}
.pill.teal{color:var(--teal);background:var(--teal-dim);border-color:transparent}
.pill.violet{color:var(--violet);background:rgba(155,140,255,.15);border-color:transparent}
.tabs{display:inline-flex;gap:2px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;font-weight:700;font-size:12.5px;cursor:pointer}
.tabs button.on{background:var(--panel-3);color:var(--text)}

/* checks */
.check{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg-2);cursor:pointer;user-select:none}
.check:hover{border-color:var(--line-2)}
.check .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;transition:all .15s}
.check .box svg{width:13px;height:13px;opacity:0;transform:scale(.6);transition:all .15s}
.check.on{border-color:rgba(72,209,138,.35);background:var(--good-dim)}
.check.on .box{background:var(--good);border-color:var(--good);color:#06301b}
.check.on .box svg{opacity:1;transform:scale(1)}
.check .t{flex:1;font-weight:600}
.check .t small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.check .mono{color:var(--muted);font-size:12.5px}

/* prayer strip */
.sholat{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sholat .p{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative;transition:all .15s}
.sholat .p .n{font-weight:700;font-size:13px}
.sholat .p .w{font-family:var(--mono);font-size:19px;letter-spacing:-.02em;color:var(--text)}
.sholat .p .s{font-size:11px;color:var(--dim)}
.sholat .p.next{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
.sholat .p.next .s{color:var(--gold-2)}
.sholat .p.on{background:var(--good-dim);border-color:rgba(72,209,138,.4)}
.sholat .p.on .w{color:var(--good)}
.sholat .p .tick{position:absolute;right:10px;top:10px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center}
.sholat .p.on .tick{background:var(--good);border-color:var(--good);color:#06301b}
.sholat .p .tick svg{width:11px;height:11px}

.sholat .p.past{opacity:.55}
.sholat .p{cursor:default}
/* pertanyaan sholat */
.ask{margin-top:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,var(--gold-dim),transparent 60%),var(--bg-2);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ask.lengkap{background:linear-gradient(135deg,var(--good-dim),transparent 60%),var(--bg-2);border-color:rgba(72,209,138,.35)}
.ask.bolos{background:linear-gradient(135deg,var(--bad-dim),transparent 60%),var(--bg-2);border-color:rgba(239,93,111,.35)}
.ask .q{display:flex;flex-direction:column;gap:2px;flex:1;min-width:200px}
.ask .q b{font-family:var(--serif);font-size:20px;font-weight:400}
.ask .opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--panel-2);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;transition:all .15s}
.opt svg{width:15px;height:15px}
.opt.good.on{background:var(--good);border-color:var(--good);color:#06301b;box-shadow:0 0 0 4px var(--good-dim)}
.opt.bad.on{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 0 0 4px var(--bad-dim)}
.opt:hover:not(.on){color:var(--text);border-color:var(--gold)}
/* agenda (daftar kegiatan satu hari) */
.agenda{display:flex;flex-direction:column;gap:2px}
.ag{display:grid;grid-template-columns:44px 3px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:9px}
.ag .t{font-size:12px;color:var(--muted)}
.ag .bar{align-self:stretch;min-height:22px;background:var(--c);border-radius:3px}
.ag .x b{display:block;font-size:13px;font-weight:600}
.ag .x small{display:block;color:var(--muted);font-size:11.5px}
.ag .st{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ag.lewat{opacity:.5}
.ag.kini{background:var(--gold-dim);box-shadow:inset 0 0 0 1px rgba(227,178,90,.35)}
.ag[data-act]{cursor:pointer}.ag[data-act]:hover{background:var(--panel-2)}
/* jadwal seminggu */
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(138px,1fr));gap:8px;min-width:1000px}
.wday{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px}
.wday.today{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
.wday .dn{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 2px 6px}
.wday.today .dn{color:var(--gold-2)}
.wb{position:relative;border-left:3px solid var(--c);background:var(--panel-2);border-radius:7px;padding:5px 20px 5px 7px;font-size:11.5px;display:flex;flex-direction:column;gap:1px}
.wb .mono{font-size:10.5px;color:var(--muted)}
.wb b{font-weight:600;line-height:1.3}
.wb.sholat{background:transparent;padding-top:3px;padding-bottom:3px}
.wb.sholat b{font-weight:500;color:var(--muted)}
.wb.ok::after{content:"✓";position:absolute;right:7px;top:5px;color:var(--good);font-weight:800}
.wb.miss{box-shadow:inset 0 0 0 1px rgba(239,93,111,.55)}
.wb.clash{background:var(--bad-dim)}
.wb .flag{font-size:10px;color:var(--teal)}.wb .flag.bad{color:var(--bad)}
.wb[data-act]{cursor:pointer}.wb[data-act]:hover{background:var(--panel-3)}
.chips{display:flex;gap:3px}
.chips span{font-size:10.5px;font-weight:700;width:24px;text-align:center;padding:2px 0;border-radius:5px;background:var(--panel-3);color:var(--dim)}
.chips span.on{background:var(--good-dim);color:var(--good)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{cursor:pointer}
.daypick input{position:absolute;opacity:0;pointer-events:none}
.daypick span{display:inline-block;padding:7px 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--muted);font-weight:700;font-size:12.5px}
.daypick input:checked + span{background:var(--gold-dim);border-color:var(--gold);color:var(--gold-2)}
.daypick input:focus-visible + span{outline:2px solid var(--gold);outline-offset:2px}
/* input cepat transaksi */
.quick{display:grid;grid-template-columns:150px minmax(0,1fr) 150px 140px auto;gap:8px;align-items:center}
.quick.compact{grid-template-columns:minmax(0,1fr) 130px;margin-top:12px}
.quick input[name=jumlah]{font-family:var(--mono);text-align:right}
/* hutang per minggu */
.weeks{display:flex;flex-direction:column;gap:10px}
.wk{display:grid;grid-template-columns:140px minmax(0,1fr) 80px 120px;gap:12px;align-items:center;font-size:12.5px}
.wk.now .lbl{color:var(--gold-2);font-weight:700}
.wk .tr{height:12px;background:var(--panel-3);border-radius:99px;position:relative}
.wk .tr b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--good))}
.wk .tr i{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--gold);border-radius:2px}
.wk .v{text-align:right;color:var(--muted)}
.wk .pill{justify-self:start}
/* kartu fokus */
.fk{display:flex;flex-direction:column;gap:6px}
.fk h3{font-size:26px;font-weight:400;margin:2px 0 4px}
.fk .big{font-size:34px;font-weight:600;line-height:1;letter-spacing:-.02em}
.fk .lbl{font-size:12px;color:var(--muted)}
.fk .kv{margin-top:6px}
.fk .kv input{background:var(--bg-2)}
/* kalender sholat */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{aspect-ratio:1;border-radius:10px;background:var(--panel-3);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .1s}
.cal-cell:hover:not(.blank):not(.future){transform:scale(1.05);border-color:var(--gold)}
.cal-cell .d{font-family:var(--mono);font-weight:600;font-size:14px}
.cal-cell .m{font-size:10px;color:var(--dim);font-weight:700}
.cal-cell.blank{background:transparent;cursor:default}
.cal-cell.future{opacity:.3;cursor:default}
.cal-cell.lengkap{background:var(--good);color:#06301b}.cal-cell.lengkap .m{color:#06301b}
.cal-cell.bolos{background:var(--bad);color:#fff}.cal-cell.bolos .m{color:#fff}
.cal-cell.today{box-shadow:0 0 0 2px var(--gold)}
/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--panel-3);display:block}
.heat i.l1{background:rgba(72,209,138,.35)}.heat i.l2{background:rgba(72,209,138,.65)}.heat i.l3{background:var(--good)}
.heat i.v{background:var(--bad)}
.heat i.today{outline:1.5px solid var(--gold);outline-offset:1px}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.item .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.item .hd b{font-size:14.5px}
.item p{margin:0;color:var(--muted);font-size:13px;white-space:pre-wrap}
.item .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim)}
.prog{height:6px;background:var(--panel-3);border-radius:99px;overflow:hidden}
.prog b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--good));border-radius:99px}
.prog.gold b{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--line-2);border-radius:12px;font-size:13px}

/* week grid */
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.day{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:140px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}
.day .dn{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.day.today .dn{color:var(--teal)}

/* ---------- util ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => key(new Date());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return key(d); };
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtTgl = (k, long=true) => { const d = parseKey(k); return long ? `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}` : `${d.getDate()} ${BLN[d.getMonth()]}`; };
const fmtBulan = mk => { const [y,m] = mk.split('-'); return `${BULAN[+m-1]} ${y}`; };
const rp = n => 'Rp' + Math.round(Number(n)||0).toLocaleString('id-ID');
const rpS = n => { n = Number(n)||0; const a = Math.abs(n); const s = n<0?'−':''; if (a>=1e9) return s+'Rp'+(a/1e9).toFixed(2).replace('.',',')+' M'; if (a>=1e6) return s+'Rp'+(a/1e6).toFixed(a>=1e7?1:2).replace('.',',')+' jt'; if (a>=1e3) return s+'Rp'+Math.round(a/1e3)+' rb'; return s+'Rp'+a; };
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const clone = o => JSON.parse(JSON.stringify(o));
const hijri = d => { try { return new Intl.DateTimeFormat('id-ID-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(d); } catch { return ''; } };
function toast(msg, bad=false){ const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad?' bad':''); clearTimeout(t._t); t._t = setTimeout(()=> t.classList.remove('show'), 2200); }

/* ---------- penyimpanan: Supabase (satu baris per dokumen per pengguna) ---------- */
// Tabel public.markas_dokumen(user_id, path, data jsonb, diperbarui). RLS: tiap orang hanya barisnya sendiri.
// Kunci di bawah kunci PUBLIK; yang menjaga data adalah kebijakan RLS (lihat supabase/skema.sql).
const SUPABASE_URL = 'https://fqpktykrkpqaztnpqgxz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UcFfp0XqHZWMZ2jpSRlDvg_vySECBzo';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let pengguna = null;           // auth.user Supabase; null = belum masuk (mode coba: localStorage)
let tamu = false;              // belum masuk & bukan mode coba: lihat-lihat dengan data contoh, tidak bisa menyimpan
const LS = 'markas:';
const store = {
  async init(){
    try { pengguna = sb ? ((await sb.auth.getSession()).data.session || {}).user || null : null; } catch { pengguna = null; }
    const b = $('#storeBadge');
    if (pengguna) { b.className = 'store cloud'; b.innerHTML = `<i></i>${esc(pengguna.email)} · <a href="#" data-act="keluar" style="color:inherit">keluar</a>`; }
    else if (localStorage.getItem(LS+'mode-coba')) { b.className = 'store local'; b.innerHTML = '<i></i>Mode coba: tersimpan di browser ini saja · <a href="#" data-act="keluar" style="color:inherit">masuk</a>'; }
    else { tamu = true; b.className = 'store'; b.innerHTML = '<i></i>Lihat-lihat · <a href="#" data-act="masuk" style="color:inherit">masuk</a> · <a href="#" data-act="daftar" style="color:inherit">daftar</a>'; }
  },
  async get(path, fallback){
    if (tamu) { const C = contohDok(); return C[path] ? clone(C[path]) : clone(fallback); }
    try {
      if (pengguna) { const { data, error } = await sb.from('markas_dokumen').select('data').eq('user_id', pengguna.id).eq('path', path).maybeSingle(); if (error) throw error; return data ? clone(data.data) : clone(fallback); }
      const raw = localStorage.getItem(LS+path); return raw ? JSON.parse(raw) : clone(fallback);
    } catch (e) { console.warn('get', path, e); return clone(fallback); }
  },
  async set(path, data){
    if (tamu) { vMasuk('Masuk atau daftar dulu supaya isianmu tersimpan.'); return false; }
    data.diperbarui = new Date().toISOString();
    try {
      if (pengguna) { const { error } = await sb.from('markas_dokumen').upsert({ user_id: pengguna.id, path, data, diperbarui: data.diperbarui }, { onConflict: 'user_id,path' }); if (error) throw error; }
      else localStorage.setItem(LS+path, JSON.stringify(data));
      return true;
    } catch (e) { console.warn('set', path, e); toast('Gagal menyimpan: ' + (e.message||e.code||e), true); return false; }
  },
  async listHarian(){
    const out = {};
    if (tamu) return contohHarian();
    try {
      if (pengguna) { const { data, error } = await sb.from('markas_dokumen').select('path,data').eq('user_id', pengguna.id).like('path', 'harian/%').limit(2000); if (error) throw error; (data||[]).forEach(r => { out[r.path.slice(7)] = clone(r.data); }); }
      else { for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k.startsWith(LS+'harian/')) out[k.slice((LS+'harian/').length)] = JSON.parse(localStorage.getItem(k)); } }
    } catch (e) { console.warn('listHarian', e); }
    return out;
  }
};

/* ---------- layar masuk / daftar ---------- */
function vMasuk(pesan='', mode='masuk'){
  const alur = location.href.replace(/[#?].*$/, '');
  const bg = $('#modalBg'), m = $('#modal');
  m.innerHTML = `
  <div class="masuk-tab"><button type="button" data-mode="masuk" class="${mode==='masuk'?'on':''}">Masuk</button><button type="button" data-mode="daftar" class="${mode==='daftar'?'on':''}">Daftar (gratis)</button></div>
  ${pesan ? `<div class="small" style="color:var(--gold-2);margin-bottom:10px">${pesan}</div>` : ''}
  <form class="form" data-form="masuk" style="${mode==='masuk'?'':'display:none'}">
    <label class="f">Email<input type="email" name="email" required autocomplete="email"></label>
    <label class="f">Kata sandi<input type="password" name="sandi" required minlength="6" autocomplete="current-password"></label>
    <div class="actions"><button class="btn ghost" type="button" data-act="lupa-sandi">Lupa sandi</button><button class="btn primary" type="submit">Masuk</button></div>
    <div class="small dim" style="margin-top:10px">Mau coba dulu tanpa akun? <a href="#" data-act="mode-coba">Coba di browser ini</a> (data tidak ikut ke HP lain).</div>
  </form>
  <form class="form" data-form="daftar" style="${mode==='daftar'?'':'display:none'}">
    <label class="f">Nama panggilan<input type="text" name="nama" required maxlength="40"></label>
    <label class="f">Email<input type="email" name="email" required autocomplete="email"></label>
    <label class="f">Kata sandi (min. 6 huruf)<input type="password" name="sandi" required minlength="6" autocomplete="new-password"></label>
    <div class="actions"><button type="button" class="btn ghost" data-close>Batal</button><button class="btn primary" type="submit">Buat akun</button></div>
    <div class="small dim" style="margin-top:10px">Setelah mendaftar, cek email untuk tautan konfirmasi, lalu masuk. Datamu hanya bisa dibaca oleh akunmu sendiri. Sudah punya akun situs Hanif Dossier? Langsung <a href="#" data-mode="masuk" class="ke-masuk">masuk</a>, akunnya sama.</div>
  </form>`;
  bg.classList.add('show');
  const close = () => { bg.classList.remove('show'); m.innerHTML = ''; };
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  m.querySelectorAll('.masuk-tab button, .ke-masuk').forEach(b => b.onclick = e => { e.preventDefault(); vMasuk('', b.dataset.mode); });
  m.querySelector('form[data-form="masuk"]').onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target).entries());
    const { error } = await sb.auth.signInWithPassword({ email: d.email.trim(), password: d.sandi }); if (error) return toast(error.message.includes('Invalid') ? 'Email atau sandi salah' : error.message, true); location.reload(); };
  m.querySelector('form[data-form="daftar"]').onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target).entries());
    const email = d.email.trim();
    const { data: res, error } = await sb.auth.signUp({ email, password: d.sandi, options: { data: { nama: d.nama.trim(), aplikasi: 'markas' }, emailRedirectTo: alur } });
    if (error) return toast(error.message, true);
    // Email sudah terdaftar: Supabase tidak mengirim email apa pun dan mengembalikan user "kosong" (identities = []).
    if (res && res.user && Array.isArray(res.user.identities) && res.user.identities.length === 0) {
      vMasuk('Email <b>' + esc(email) + '</b> sudah punya akun (akun situs Hanif Dossier berlaku di sini juga). Masuk dengan sandi yang sama, atau klik <b>Lupa sandi</b>.', 'masuk');
      $('#modal form[data-form="masuk"] [name=email]').value = email; $('#modal form[data-form="masuk"] [name=sandi]').focus(); return; }
    try { localStorage.setItem(LS+'nama-daftar', d.nama.trim()); } catch {}
    vMasuk('Akun dibuat. Buka email <b>' + esc(email) + '</b>, klik tautan konfirmasinya, lalu masuk di sini. Tidak ada email? Cek folder spam.', 'masuk');
    $('#modal form[data-form="masuk"] [name=email]').value = email; };
  m.querySelector('[data-act="lupa-sandi"]').onclick = async () => { const email = m.querySelector('form[data-form="masuk"] [name=email]').value.trim(); if (!email) return toast('Isi email dulu', true);

function waktuSholat(date, lat, lng){
  const rad = Math.PI/180, tz = -date.getTimezoneOffset()/60;
  const y = date.getFullYear(), m = date.getMonth()+1, d = date.getDate();
  const a = Math.floor((14-m)/12), yy = y+4800-a, mm = m+12*a-3;
  const jd = d + Math.floor((153*mm+2)/5) + 365*yy + Math.floor(yy/4) - Math.floor(yy/100) + Math.floor(yy/400) - 32045 - 0.5 + (12 - tz)/24;
  const D = jd - 2451545.0;
  const g = rad*((357.529 + 0.98560028*D) % 360), q = (280.459 + 0.98564736*D) % 360;
  const L = rad*((q + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) % 360);
  const e = rad*(23.439 - 0.00000036*D);
  let RA = Math.atan2(Math.cos(e)*Math.sin(L), Math.cos(L))/rad/15; RA = ((RA % 24) + 24) % 24;
  const decl = Math.asin(Math.sin(e)*Math.sin(L));
  const EqT = q/15 - RA;
  const noon = 12 + tz - lng/15 - EqT;
  const la = lat*rad;
  const T = ang => { const c = (-Math.sin(ang*rad) - Math.sin(la)*Math.sin(decl)) / (Math.cos(la)*Math.cos(decl)); return Math.acos(Math.max(-1,Math.min(1,c)))/rad/15; };
  const asr = () => { const t = 1 + Math.tan(Math.abs(la - decl)); const ang = Math.atan(1/t); const c = (Math.sin(ang) - Math.sin(la)*Math.sin(decl)) / (Math.cos(la)*Math.cos(decl)); return Math.acos(Math.max(-1,Math.min(1,c)))/rad/15; };
  const toMin = h => Math.round(((h % 24)+24)%24 * 60);
  return {
    subuh: toMin(noon - T(20)) + 2, terbit: toMin(noon - T(0.833)) - 2, dzuhur: toMin(noon) + 2,
    ashar: toMin(noon + asr()) + 2, maghrib: toMin(noon + T(0.833)) + 2, isya: toMin(noon + T(18)) + 2
  };
}

/* ---------- logika disiplin & streak ---------- */
const aturanHarian = () => S.pengaturan.aturan.filter(a => a.jenis==='harian');

function statusSholat(k){ const s = hari(k).sholat; if (!s) return ''; if (s.status) return s.status; return SHOLAT.every(([id]) => s[id]) ? 'lengkap' : ''; } // data lama (centang per waktu) tetap terbaca
function skorHari(k){
  const h = hari(k);
  const sholat = statusSholat(k); const shOk = sholat==='lengkap';
  const hb = aturanHarian().filter(a => h.kebiasaan && h.kebiasaan[a.id]).length;
  const total = 1 + aturanHarian().length, done = (shOk?1:0) + hb;
  const langgar = (h.pelanggaran||[]).length > 0;
  return { sholat, shOk, hb, done, total, langgar, lengkap: done===total && !langgar };
}
function hitungStreak(){
  const today = todayKey();
  // streak disiplin: hari lengkap berturut-turut, berakhir hari ini (bila lengkap) atau kemarin
  let k = skorHari(today).lengkap ? today : addDays(today,-1), streak = 0;
  while (S.harian[k] && skorHari(k).lengkap) { streak++; k = addDays(k,-1); if (streak>2000) break; }
  // hari bersih: sejak pelanggaran terakhir
  const keys = Object.keys(S.harian).sort();
  let lastV = null; keys.forEach(kk => { if ((S.harian[kk].pelanggaran||[]).length) lastV = kk; });
  const first = keys[0] || today;
  const bersih = lastV ? Math.max(0, Math.round((parseKey(today)-parseKey(lastV))/864e5)) : Math.round((parseKey(today)-parseKey(first))/864e5) + 1;
  // rekor
  let rekor = 0, run = 0; if (keys.length) { let c = keys[0]; const end = today; while (c <= end) { if (S.harian[c] && skorHari(c).lengkap) { run++; rekor = Math.max(rekor, run); } else run = 0; c = addDays(c,1); } }
  // sholat: hari lengkap dalam 30 hari terakhir + streak sholat lengkap berturut-turut
  let sTot = 0; for (let i=0;i<30;i++) if (statusSholat(addDays(today,-i))==='lengkap') sTot++;
  let ks = statusSholat(today)==='lengkap' ? today : addDays(today,-1), streakSholat = 0;
  while (statusSholat(ks)==='lengkap') { streakSholat++; ks = addDays(ks,-1); if (streakSholat>2000) break; }
  const totalLanggar = keys.reduce((n,kk) => n + (S.harian[kk].pelanggaran||[]).length, 0);
  return { streak, bersih, rekor, lastV, sholat30: pct(sTot, 30), streakSholat, totalLanggar };
}

    const luarFF = new Set((S.aruskas.rutin||[]).filter(x => x.ff===false).map(x => x.id)); // rutin sementara (mis. kuliah) yang tidak ikut target FF
    tx.forEach(t => { if (t.kategori==='Pemasukan') r.pemasukan += +t.masuk||0; else { const v = +t.keluar||0; if (t.kategori==='Tabungan') r.tabungan += v; else { r.pengeluaran += v; if (t.hutang) r.hutang += v; if (t.rutin) r.rutin += v; if (t.rutin && luarFF.has(t.rutin)) r.nonFF += v; if (t.kategori==='Kuliah' || t.rutin==='kuliah') r.kuliah += v; if (t.kategori==='Kebutuhan') r.kebutuhan+=v; else if (t.kategori==='Keinginan') r.keinginan+=v; else r.kewajiban+=v; } } });
    return { ...r, sumber:'transaksi', n: tx.length };
  }
  const m = (S.aruskas.bulan||{})[mk]; if (m) return { pemasukan:+m.pemasukan||0, pengeluaran:+m.pengeluaran||0, tabungan:+m.tabungan||0, hutang:0, rutin:0, sumber:'ringkasan', n:0 };
  return { pemasukan:0, pengeluaran:0, tabungan:0, hutang:0, rutin:0, sumber:'kosong', n:0 };
}
const totalAset = () => (S.aset.aset||[]).reduce((n,a) => n + (+a.nilai||0), 0);
const totalUtang = () => (S.aset.utang||[]).reduce((n,a) => n + (+a.nilai||0), 0);
/* fokus: angka turunan untuk kartu utama */
function pengeluaranRata(){ // rata-rata 3 bulan penuh terakhir yang punya data
  if (+S.fokus.pengeluaranBulanan > 0) return { nilai:+S.fokus.pengeluaranBulanan, sumber:'manual' };
  const vals = []; const d = new Date(); d.setDate(1);
  for (let i=1;i<=6 && vals.length<3;i++){ const m = new Date(d.getFullYear(), d.getMonth()-i, 1); const r = ringkasBulan(monthKey(m)); if (r.sumber!=='kosong' && r.pengeluaran>0) vals.push(r.pengeluaran - (r.hutang||0) - (r.nonFF||0) - (r.kuliah||0)); } // cicilan hutang & kuliah dipisah; kuliah ditambahkan lagi di infoFF sebagai angka patokan
  return { nilai: vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0, sumber: vals.length ? `rata-rata ${vals.length} bulan penuh terakhir, tanpa kuliah & cicilan hutang` : 'belum ada data' };
}
function infoHutang(){
  const sisa = totalUtang(), puncak = +S.fokus.puncakUtang||sisa, cicilan = +S.fokus.cicilanMingguan||0;
  const minggu = cicilan ? Math.ceil(sisa/cicilan) : 0; const lunas = new Date(); lunas.setDate(lunas.getDate() + minggu*7);
  // rata-rata bayar per minggu: maksimal 4 minggu terakhir, dihitung sejak pembayaran pertama yang tercatat
  const bayar = txHutang(); let rata4 = 0, lunasRata = '';
  if (bayar.length) { const ws = awalMinggu(todayKey()); const first = awalMinggu(bayar.map(t=>t.tanggal).sort()[0]);
    const akhir = (bayarMinggu(ws) > 0 || first >= ws) ? ws : addDays(ws, -7); // minggu berjalan yang belum dibayar tidak ikut dirata-rata
    const n = Math.max(1, Math.min(4, Math.round((parseKey(akhir)-parseKey(first))/(7*864e5)) + 1)); const dari = addDays(akhir, -7*(n-1));
    rata4 = Math.round(bayar.filter(t=>t.tanggal>=dari && t.tanggal<=addDays(akhir,6)).reduce((s,t)=>s+(+t.keluar||0),0) / n);
    if (rata4>0) { const d = new Date(); d.setDate(d.getDate() + Math.ceil(sisa/rata4)*7); lunasRata = key(d); } }
  return { sisa, puncak, cicilan, minggu, lunas: key(lunas), terbayar: pct(puncak-sisa, puncak), rata4, lunasRata };
}
/* FF = (pengeluaran bulanan tanpa kuliah + biaya kuliah per bulan) × 12 × 25.
   Biaya kuliah memakai angka patokan per minggu (bawaan Rp300 rb) dikonversi ke bulanan: × 52 ÷ 12. */
function infoFF(){
  const p = pengeluaranRata(); const kuliahMinggu = S.fokus.kuliahMingguan ?? 300000; const kuliahBulan = Math.round((+kuliahMinggu||0) * 52 / 12);
  const bulanan = p.nilai + kuliahBulan; const target = bulanan*12*25; const kb = totalAset()-totalUtang();
  return { pengeluaran:p.nilai, kuliahMinggu:+kuliahMinggu||0, kuliahBulan, bulanan, sumber:p.sumber, target, kb, aset: totalAset(), progres: target ? Math.max(0, Math.min(100, Math.round(kb/target*100))) : 0, kurang: Math.max(0, target-kb) };
}

const tile = (lbl, big, sub='', cls='') => `<div class="tile ${cls}"><div class="lbl">${lbl}</div><div class="big">${big}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
function heatmap(weeks=16){
  const today = todayKey(); const start = parseKey(addDays(today, -(weeks*7-1))); start.setDate(start.getDate() - start.getDay());
  let html = '<div class="heat">'; let d = key(start);
  while (d <= today) { const s = skorHari(d); let c = ''; if (s.langgar) c='v'; else if (s.done>0) { const r = s.done/s.total; c = r>=1?'l3':r>=.6?'l2':'l1'; } html += `<i class="${c}${d===today?' today':''}" title="${fmtTgl(d)}: ${s.done}/${s.total}${s.langgar?' · ada pelanggaran':''}"></i>`; d = addDays(d,1); }
  return html + '</div>';
}
function barChart(series, opts={}){ // series: [{label, values:{a,b,c}}], opts.keys [[key,color]]
  const W = 600, H = 190, padL = 44, padB = 26, padT = 10; const keys = opts.keys;
  const max = Math.max(1, ...series.flatMap(s => keys.map(([k]) => +s.values[k]||0)));
  const step = Math.pow(10, Math.floor(Math.log10(max))); const nice = Math.ceil(max/step)*step;
  const gw = (W-padL)/series.length, bw = Math.min(22, (gw-10)/keys.length);
  let g = '<g class="grid">'; for (let i=0;i<=4;i++){ const y = padT + (H-padT-padB)*(1-i/4); g += `<line x1="${padL}" x2="${W}" y1="${y}" y2="${y}"/><text x="${padL-6}" y="${y+3}" text-anchor="end">${rpS(nice*i/4).replace('Rp','')}</text>`; } g += '</g>';
  let bars = ''; series.forEach((s,i) => { const x0 = padL + gw*i + (gw - bw*keys.length - 3*(keys.length-1))/2; keys.forEach(([k,color],j) => { const v = +s.values[k]||0; const h = (H-padT-padB)*v/nice; bars += `<rect x="${x0+j*(bw+3)}" y="${H-padB-h}" width="${bw}" height="${h}" rx="3" fill="${color}" opacity="${v?1:.25}"><title>${s.label} · ${k}: ${rp(v)}</title></rect>`; }); bars += `<text x="${padL+gw*i+gw/2}" y="${H-8}" text-anchor="middle">${s.label}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${bars}</svg>`;
}
function lineChart(points){ // [{label, v}]
  const W = 600, H = 170, padL = 48, padB = 24, padT = 12, padR = 12; if (points.length<2) return '<div class="empty">Isi nilai aset minimal dua bulan untuk melihat grafik.</div>';
  const vals = points.map(p=>p.v); const lo = Math.min(0, ...vals), hi = Math.max(...vals)||1; const span = hi-lo || 1;
  const X = i => padL + (W-padL-padR)*i/(points.length-1), Y = v => padT + (H-padT-padB)*(1-(v-lo)/span);
  let g = '<g class="grid">'; for (let i=0;i<=3;i++){ const v = lo + span*i/3; g += `<line x1="${padL}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${padL-6}" y="${Y(v)+3}" text-anchor="end">${rpS(v).replace('Rp','')}</text>`; } g += '</g>';
  const path = points.map((p,i) => `${i?'L':'M'}${X(i)},${Y(p.v)}`).join(' ');
  const area = path + ` L${X(points.length-1)},${Y(lo)} L${X(0)},${Y(lo)} Z`;
  const dots = points.map((p,i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="${i===points.length-1?4.5:3}" fill="${i===points.length-1?'var(--gold-2)':'var(--panel)'}" stroke="var(--gold)" stroke-width="2"><title>${p.label}: ${rp(p.v)}</title></circle><text x="${X(i)}" y="${H-6}" text-anchor="middle">${p.label}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".35"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ----- Rencana 3 tahun ----- */
function fase3Tahun(){
  const m = parseKey(S.pengaturan.mulai3Tahun||'2026-09-01'); const out = [];
  for (let i=0;i<6;i++){ const a = new Date(m.getFullYear(), m.getMonth()+i*6, 1); const b = new Date(m.getFullYear(), m.getMonth()+i*6+6, 0);
    out.push({ i, mulai:key(a), akhir:key(b), nama: i<4 ? `Semester ${5+i}` : i===4 ? 'Lulus · tahun 1' : 'Tahun 3', sub:`${BLN[a.getMonth()]} ${a.getFullYear()} – ${BLN[b.getMonth()]} ${b.getFullYear()}` }); }
  return out;
}

  const mulai = parseKey(S.pengaturan.mulai3Tahun||'2026-09-01'); const lewat = Math.max(0, Math.min(100, Math.round((new Date()-mulai)/(3*365.25*864e5)*100)));

    <input type="range" min="0" max="100" step="5" value="${x.selesai?100:x.progres||0}" data-act="rencana-progres" data-id="${x.id}" ${x.selesai?'disabled':''}>
    <div class="row between"><label class="row small muted" style="cursor:pointer"><input type="checkbox" data-act="rencana-selesai" data-id="${x.id}" ${x.selesai?'checked':''}> Tandai selesai</label></div></div>`;
  return `
  <div class="topbar"><div><div class="eyebrow">${fmtTgl(S.pengaturan.mulai3Tahun||'2026-09-01',false)} ${(S.pengaturan.mulai3Tahun||'2026').slice(0,4)} → 2029</div><h1 class="serif"><em>Planning</em></h1><div class="sub">Target dipisah per semester supaya tiap enam bulan ada yang bisa dicek. Angka bawaan hanya usulan; ubah sesukamu.</div></div>
    <div class="row"><select data-field="rencanaKat" style="width:auto"><option>Semua</option>${KATEGORI_RENCANA.map(k=>`<option ${filter===k?'selected':''}>${k}</option>`).join('')}</select><button class="btn primary" data-act="rencana-tambah">Tambah target</button></div></div>

  </div>`;
}

/* ----- Jadwal rutinitas ----- */
const JENIS = { sholat:'Sholat', kuliah:'Kuliah', ibadah:'Ibadah', kebiasaan:'Kebiasaan', keuangan:'Keuangan', agenda:'Agenda' };
const WARNA = { sholat:'var(--gold)', ibadah:'var(--gold-2)', kuliah:'var(--teal)', kebiasaan:'var(--good)', keuangan:'var(--violet)', agenda:'var(--muted)' };
const keMenit = t => { const [h,m] = String(t||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); };
const menitSekarang = () => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); };
const pilihanTautan = () => [['', 'Tidak ditautkan'], ...aturanHarian().map(a => [a.id, 'Kebiasaan: ' + a.nama]), ['jurnal','Isi jurnal'], ['catat','Catat pengeluaran'], ['hutang','Bayar hutang minggu ini']];
function pergi(view){ if (S.view===view) render(); else location.hash = '#' + view; }
const awalPakai = () => Object.keys(S.harian).sort()[0] || todayKey(); // hari sebelum dasbor dipakai tidak dihitung terlewat

/* semua kegiatan satu tanggal: sholat (dihitung), kuliah, rutinitas, dan DCA; lalu tandai bentrok */
function blokHari(k){
  const d = parseKey(k), dow = d.getDay(), out = [];
  const wt = waktuSholat(d, S.pengaturan.lat, S.pengaturan.lng);
  SHOLAT.forEach(([id,n]) => out.push({ id:'sholat-'+id, judul:n, jenis:'sholat', mulai:jam(wt[id]), selesai:jam(wt[id]+15), link:'sholat' }));
  (S.kuliah.items||[]).filter(c => c.hari===dow).forEach(c => out.push({ id:'kuliah-'+c.id, judul:c.mk, jenis:'kuliah', mulai:c.mulai, selesai:c.selesai, ket:c.ruang||'' }));
  const kuliahHariIni = (S.kuliah.items||[]).filter(c => c.hari===dow).map(c => [keMenit(c.mulai), keMenit(c.selesai)]);
  (S.jadwal.items||[]).filter(x => (x.hari||[]).includes(dow)).forEach(x => {
    if (!x.setelah || wt[x.setelah]===undefined) { out.push({ ...x }); return; }
    // relatif terhadap sholat: mulai setelah sholat (15 menit) + jeda; geser ke setelah kuliah kalau bertabrakan
    const lama = +x.durasi || 15; let m0 = wt[x.setelah] + 15 + (+x.jeda||0), geser = false;
    for (const [a, b] of kuliahHariIni) if (m0 < b && m0 + lama > a) { m0 = b; geser = true; }
    out.push({ ...x, mulai:jam(m0), selesai:jam(m0 + lama), ket: geser ? `Digeser: selesai kuliah dulu${x.ket?' · '+x.ket:''}` : x.ket });
  });
  (S.aset.aset||[]).filter(a => a.dca && a.dca.aktif && +a.dca.jumlah>0).forEach(a => { const p = a.dca;
    const cocok = p.frek==='bulanan' ? d.getDate() === Math.min(+p.tanggal||1, 28) : dow === +p.hari;
    if (cocok) out.push({ id:'dca-'+a.id, judul:`DCA ${a.nama} ${rpS(p.jumlah)}`, jenis:'keuangan', mulai:p.jam||'10:15', selesai:jam(keMenit(p.jam||'10:15')+15), link:'dca:'+a.id, ket:p.frek==='bulanan'?'setoran bulanan':'setoran mingguan' }); });
  out.forEach(b => { b.m0 = keMenit(b.mulai); b.m1 = keMenit(b.selesai||b.mulai); if (b.m1 <= b.m0) b.m1 = b.m0 + 15; });
  out.sort((a,b) => a.m0 - b.m0 || (a.jenis==='sholat' ? -1 : 1));
  out.forEach(b => {
    if (b.jenis==='sholat') { b.sela = out.some(o => o.jenis==='kuliah' && b.m0 >= o.m0 && b.m0 < o.m1); return; }
    b.bentrok = out.some(o => o!==b && o.jenis!=='sholat' && o.m0 < b.m1 && b.m0 < o.m1);
  });
  return out;
}
/* true = selesai, false = belum, null = tidak bisa dicek otomatis */
function selesaiBlok(b, k){
  const l = b.link; if (!l) return null; const h = hari(k);
  if (l==='sholat') { const s = statusSholat(k); return s==='lengkap' ? true : s==='bolos' ? false : null; }
  if (l==='jurnal') return !!(h.jurnal && (h.jurnal.refleksi || h.jurnal.syukur || h.jurnal.pelajaran || h.jurnal.besok));
  if (l==='catat') return (S.aruskas.transaksi||[]).some(t => t.tanggal===k && !t.rutin);
  if (l==='hutang') { const t = +S.fokus.cicilanMingguan||0, p = bayarMinggu(awalMinggu(k)); return t ? p >= t : p > 0; }
  if (l.startsWith('dca:')) { const a = (S.aset.aset||[]).find(x => x.id===l.slice(4)); const s = a ? statusDCA(a, k) : null; return s ? s.ok : null; }
  return !!(h.kebiasaan && h.kebiasaan[l]);
}
async function klikBlok(link, k){
  if (!link) return;
  if (link==='sholat') return pergi('sholat');
  if (link==='jurnal') { S.jurnalTgl = k > todayKey() ? todayKey() : k; return pergi('jurnal'); }
  if (link==='catat') { S.tab.keuangan = 'arus'; return pergi('keuangan'); }
  if (link==='hutang') { S.tab.keuangan = 'hutang'; return pergi('keuangan'); }
  if (link.startsWith('dca:')) return modalSetor(link.slice(4));
  if (k > todayKey()) { toast('Belum harinya. Centang saat sudah dikerjakan.', true); return; }
  const h = hari(k); h.kebiasaan = h.kebiasaan||{}; h.kebiasaan[link] = !h.kebiasaan[link]; await simpanHari(k, h);
  toast(h.kebiasaan[link] ? 'Selesai, tercentang' : 'Centang dibatalkan'); render();
}
function tandaBlok(b, k, lewat){
  const s = selesaiBlok(b, k); const f = [];
  if (s===true) f.push('<span class="pill good">selesai</span>');
  else if (s===false && b.jenis==='sholat') f.push('<span class="pill bad">bolos</span>');
  else if (s===false && lewat) f.push('<span class="pill warn">belum</span>');
  if (b.sela) f.push('<span class="pill teal" title="Waktu sholat jatuh di jam kuliah">di sela kuliah</span>');
  if (b.bentrok) f.push('<span class="pill bad" title="Jamnya bertabrakan dengan kegiatan lain">bentrok</span>');
  return f.join('');
}
function agendaHari(k){
  const nm = menitSekarang(), tk = todayKey(); const bl = blokHari(k);
  const iNext = k===tk ? bl.findIndex(b => b.m0 > nm) : -1;
  return `<div class="agenda">${bl.map((b,i) => { const lewat = k<tk || (k===tk && b.m1 <= nm), kini = k===tk && b.m0 <= nm && nm < b.m1;
    return `<div class="ag ${lewat&&!kini?'lewat':''} ${kini?'kini':''}" style="--c:${WARNA[b.jenis]||'var(--muted)'}" ${b.link?`data-act="blok" data-link="${esc(b.link)}" data-tgl="${k}" title="Ketuk untuk menandai / membuka"`:''}>
      <span class="t mono">${b.mulai}</span><span class="bar"></span><span class="x"><b>${b.jenis==='sholat'?'Sholat ':''}${esc(b.judul)}</b>${b.ket?`<small>${esc(b.ket)}</small>`:''}</span>
      <span class="st">${kini?'<span class="pill gold">sekarang</span>':''}${i===iNext?'<span class="pill">berikutnya</span>':''}${tandaBlok(b, k, lewat)}</span></div>`; }).join('')}</div>`;
}
function vJadwal(){
  const tab = S.tab.jadwal||'minggu'; const tk = todayKey(), nm = menitSekarang();
  const ws = addDays(awalMinggu(tk), (S.jadwalOff||0)*7); const days = [0,1,2,3,4,5,6].map(i => addDays(ws, i));
  let wajib = 0, beres = 0, bentrok = 0; const mulaiPakai = awalPakai();
  days.forEach(k => blokHari(k).forEach(b => { if (b.bentrok) bentrok++; if (b.jenis==='sholat' || k < mulaiPakai) return; const s = selesaiBlok(b, k); if (s===null) return;
    if (k < tk || (k===tk && b.m1 <= nm)) { wajib++; if (s) beres++; } }));
  const sks = (S.kuliah.items||[]).reduce((n,c) => n + (keMenit(c.selesai)-keMenit(c.mulai)), 0);
  const kepatuhan = wajib ? pct(beres, wajib) : 0;
  const tabs = `<div class="tabs"><button class="${tab==='minggu'?'on':''}" data-act="tab" data-k="jadwal" data-v="minggu">Seminggu</button><button class="${tab==='hari'?'on':''}" data-act="tab" data-k="jadwal" data-v="hari">Hari ini</button><button class="${tab==='atur'?'on':''}" data-act="tab" data-k="jadwal" data-v="atur">Atur rutinitas</button></div>`;
  const legend = `<div class="legend" style="margin-top:10px">${Object.entries(JENIS).map(([j,l]) => `<span><i style="background:${WARNA[j]}"></i>${l}</span>`).join('')}</div>`;
  let isi = '';
  if (tab==='minggu') {
    isi = `<div class="c12 panel"><h2><span>Minggu ${labelMinggu(ws)} ${ws===awalMinggu(tk)?'<span class="pill gold">minggu ini</span>':''}</span><span class="row"><button class="btn sm" data-act="jadwal-geser" data-v="-1" aria-label="Minggu sebelumnya">‹</button><button class="btn sm" data-act="jadwal-geser" data-v="0">Minggu ini</button><button class="btn sm" data-act="jadwal-geser" data-v="1" aria-label="Minggu berikutnya">›</button></span></h2>
      <div class="scroll"><div class="wgrid">${days.map(k => { const d = parseKey(k); const lewatHari = k < tk;
        return `<div class="wday ${k===tk?'today':''}"><div class="dn"><span>${HARI[d.getDay()]}</span><span>${d.getDate()} ${BLN[d.getMonth()]}</span></div>${blokHari(k).map(b => { const s = selesaiBlok(b, k); const lewat = lewatHari || (k===tk && b.m1 <= nm);
          return `<div class="wb ${b.jenis} ${s===true?'ok':''} ${s===false&&lewat&&b.jenis!=='sholat'&&k>=mulaiPakai?'miss':''} ${b.bentrok?'clash':''}" style="--c:${WARNA[b.jenis]||'var(--muted)'}" ${b.link?`data-act="blok" data-link="${esc(b.link)}" data-tgl="${k}"`:''} title="${esc(b.judul)}${b.ket?' · '+esc(b.ket):''}"><span class="mono">${b.mulai}${b.jenis!=='sholat'&&b.selesai?'–'+b.selesai:''}</span><b>${b.jenis==='sholat'?'Sholat ':''}${esc(b.judul)}</b>${b.sela?'<span class="flag">di sela kuliah</span>':''}${b.bentrok?'<span class="flag bad">bentrok</span>':''}</div>`; }).join('')}</div>`; }).join('')}</div></div>
      ${legend}<div class="small dim" style="margin-top:8px">Ketuk kegiatan bertanda kebiasaan untuk mencentang, atau kegiatan keuangan untuk membuka formulirnya. ✓ = sudah dikerjakan, garis merah = terlewat.</div></div>`;
  } else if (tab==='hari') {
    const k = tk; isi = `<div class="c8 panel"><h2>${fmtTgl(k)}</h2>${agendaHari(k)}${legend}</div>
      <div class="c4 panel"><h2>Cara pakai</h2><div class="stack small muted"><span>Kegiatan yang sedang berjalan diberi warna emas, dan berikutnya ditandai.</span><span>Ketuk kebiasaan untuk mencentang. Ketuk kegiatan keuangan atau jurnal untuk langsung membuka formulirnya.</span><span>Sholat dan kuliah masuk otomatis dari halaman masing-masing.</span></div></div>`;
  } else {
    const wtHariIni = waktuSholat(new Date(), S.pengaturan.lat, S.pengaturan.lng);
    const menitItem = x => x.setelah && wtHariIni[x.setelah]!==undefined ? wtHariIni[x.setelah] + 15 + (+x.jeda||0) : keMenit(x.mulai);
    const jamItem = x => x.setelah ? `setelah ${(SHOLAT.find(s => s[0]===x.setelah)||[,x.setelah])[1]}${+x.jeda?` +${x.jeda}m`:''}<div class="small dim">± ${jam(menitItem(x))}, ${x.durasi||15} menit</div>` : `${x.mulai}–${x.selesai}`;
    const items = (S.jadwal.items||[]).slice().sort((a,b) => menitItem(a) - menitItem(b)); const tautan = Object.fromEntries(pilihanTautan());
    isi = `<div class="c12 panel"><h2>Rutinitas <button class="btn sm primary" data-act="jadwal-tambah">Tambah kegiatan</button></h2>
      <div class="scroll"><table class="tbl"><thead><tr><th>Jam</th><th>Kegiatan</th><th>Jenis</th><th>Hari</th><th>Dicek dari</th><th></th></tr></thead><tbody>${items.map(x => `<tr><td class="mono" style="white-space:nowrap">${jamItem(x)}</td><td><b>${esc(x.judul)}</b>${x.ket?`<div class="small muted">${esc(x.ket)}</div>`:''}</td><td><span class="pill" style="color:${WARNA[x.jenis]}">${JENIS[x.jenis]||x.jenis}</span></td><td><div class="chips">${[1,2,3,4,5,6,0].map(d => `<span class="${(x.hari||[]).includes(d)?'on':''}">${HARI[d].slice(0,2)}</span>`).join('')}</div></td><td class="small muted">${esc(tautan[x.link||'']||'—')}</td><td class="num" style="white-space:nowrap"><button class="btn sm ghost" data-act="jadwal-edit" data-id="${x.id}">Ubah</button><button class="btn sm ghost" data-act="jadwal-hapus" data-id="${x.id}">Hapus</button></td></tr>`).join('') || '<tr><td colspan="6" class="dim">Belum ada rutinitas.</td></tr>'}</tbody></table></div>
      <div class="small dim" style="margin-top:10px">Sholat (jam kotamu), kuliah, dan rencana DCA tidak perlu ditambahkan di sini karena masuk otomatis. Kegiatan yang ditautkan akan dicek selesai/belum secara otomatis.</div></div>`;
  }
  return `
  <div class="topbar"><div><div class="eyebrow">Sistem harian</div><h1 class="serif">Jadwal <em>rutinitas</em></h1><div class="sub">Sholat, kuliah, kebiasaan, dan urusan uang dalam satu jadwal. Yang terjadwal lebih mudah dijaga daripada yang hanya diniatkan.</div></div>
    <div class="row">${tabs}</div></div>
  <div class="grid">
    <div class="c3">${tile('Kepatuhan minggu ini', wajib ? kepatuhan+'%' : '–', wajib ? `${beres} dari ${wajib} kegiatan yang sudah lewat` : 'belum ada yang lewat', kepatuhan>=80?'good':kepatuhan>=50?'gold':wajib?'bad':'')}</div>
    <div class="c3">${tile('Kuliah per minggu', (S.kuliah.items||[]).length + ' sesi', `${Math.floor(sks/60)} jam ${sks%60} menit di kelas`, 'teal')}</div>
    <div class="c3">${tile('Rutinitas', (S.jadwal.items||[]).length, 'kegiatan yang kamu atur', '')}</div>
    <div class="c3">${tile('Bentrok', bentrok, bentrok ? 'kegiatan dengan jam bertabrakan, cek yang bertanda merah' : 'tidak ada jam bertabrakan', bentrok?'bad':'good')}</div>
    ${isi}
  </div>`;
}

/* ----- Keuangan ----- */
const awalMinggu =k => { const d = parseKey(k); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return key(d); }; // Senin
const labelMinggu = ws => { const a = parseKey(ws), b = parseKey(addDays(ws,6)); return a.getMonth()===b.getMonth() ? `${a.getDate()}–${b.getDate()} ${BLN[b.getMonth()]}` : `${a.getDate()} ${BLN[a.getMonth()]} – ${b.getDate()} ${BLN[b.getMonth()]}`; };
const txHutang = () => (S.aruskas.transaksi||[]).filter(t => t.hutang);
const bayarMinggu = ws => { const we = addDays(ws,6); return txHutang().filter(t => t.tanggal>=ws && t.tanggal<=we).reduce((n,t)=>n+(+t.keluar||0),0); };
const jumlahKeluar = list => list.reduce((n,t)=>n+(+t.keluar||0),0);

/* setoran ke aset yang sudah ada (seperti DCA): nilai aset bertambah, tercatat di riwayat setoran,
   dan (opsional) di arus kas sebagai Tabungan & investasi. Membatalkan = semuanya dikembalikan. */
function statusDCA(a, k){
  const p = a.dca; if (!p || !p.aktif || !(+p.jumlah>0)) return null; k = k || todayKey();
  const dari = p.frek==='bulanan' ? k.slice(0,7)+'-01' : awalMinggu(k), sampai = p.frek==='bulanan' ? k.slice(0,7)+'-31' : addDays(dari, 6);
  const sudah = (S.aset.setoran||[]).filter(s => s.aset===a.id && s.tanggal>=dari && s.tanggal<=sampai).reduce((n,s) => n + (+s.jumlah||0), 0);
  return { sudah, target:+p.jumlah, ok: sudah >= +p.jumlah, periode: p.frek==='bulanan' ? 'bulan ini' : 'minggu ini' };
}
const jadwalDCA = p => p.frek==='bulanan' ? `tiap tanggal ${Math.min(+p.tanggal||1,28)}` : `tiap ${HARI[+p.hari]}`;
async function setorAset(d){
  const a = (S.aset.aset||[]).find(x => x.id===d.aset); if (!a) { toast('Pilih asetnya dulu', true); return false; }
  const j = Math.round(+d.jumlah||0); if (!(j>0)) { toast('Isi jumlah setoran', true); return false; }
  const id = uid(), tgl = d.tanggal || todayKey(), keArus = d.arus==='on';
  a.nilai = (+a.nilai||0) + j; a.disetor = (+a.disetor||0) + j;
  S.aset.setoran.push({ id, tanggal:tgl, aset:a.id, jumlah:j, catatan:d.catatan||'', arus:keArus });
  const tulis = [store.set('keuangan/aset', S.aset)];
  if (keArus) { S.aruskas.transaksi.push({ id:'setor-'+id, tanggal:tgl, ket:`Setor ${a.nama}${d.catatan?' · '+d.catatan:''}`, kategori:'Tabungan', masuk:0, keluar:j, aset:a.id, setoran:id }); tulis.push(store.set('keuangan/aruskas', S.aruskas)); }
  await Promise.all(tulis); toast(`${a.nama} bertambah ${rp(j)} → ${rp(a.nilai)}`); return true;
}
async function batalSetor(sid){
  const s = (S.aset.setoran||[]).find(x => x.id===sid); if (!s) return;
  const a = (S.aset.aset||[]).find(x => x.id===s.aset); if (a) { a.nilai = Math.max(0, (+a.nilai||0) - s.jumlah); a.disetor = Math.max(0, (+a.disetor||0) - s.jumlah); }
  S.aset.setoran = S.aset.setoran.filter(x => x.id!==sid); S.aruskas.transaksi = S.aruskas.transaksi.filter(t => t.setoran!==sid);
  await Promise.all([store.set('keuangan/aset', S.aset), store.set('keuangan/aruskas', S.aruskas)]); toast('Setoran dibatalkan, nilai aset dikembalikan');
}
function modalSetor(asetId){
  const A = S.aset.aset||[]; if (!A.length) { toast('Belum ada aset. Tambahkan dulu di tab Aset & utang.', true); return; }
  const a = A.find(x => x.id===asetId) || A[0]; const saran = a.dca && +a.dca.jumlah ? a.dca.jumlah : '';
  modal(`<h3>Setor ke aset</h3><div class="desc">Menambah nilai aset yang sudah ada, seperti DCA. Tidak membuat aset baru.</div>
  <form class="form">${F('Aset', `<select name="aset">${A.map(x => `<option value="${x.id}" ${x.id===a.id?'selected':''}>${esc(x.nama)} · ${rpS(x.nilai)}</option>`).join('')}</select>`)}
  <div class="form cols2">${F('Jumlah (Rp)', `<input type="number" name="jumlah" min="1" step="1" value="${saran}" required inputmode="numeric" style="font-family:var(--mono)">`)}${F('Tanggal', `<input type="date" name="tanggal" value="${todayKey()}" max="${todayKey()}" required>`)}</div>
  ${F('Catatan', `<input type="text" name="catatan" placeholder="opsional, misal: beli di harga turun">`)}
  <label class="row small muted" style="cursor:pointer;gap:8px"><input type="checkbox" name="arus" checked> Catat juga di arus kas sebagai Tabungan & investasi (uangnya keluar dari kas)</label>${ACTIONS('Setor')}</form>`,
  async d => { const ok = await setorAset(d); if (ok) render(); return ok; });
}
function modalDCA(asetId){
  const a = (S.aset.aset||[]).find(x => x.id===asetId); if (!a) return;
  const p = a.dca || { jumlah:'', frek:'mingguan', hari:1, tanggal:1, jam:'10:15', aktif:true };
  modal(`<h3>Rencana DCA · ${esc(a.nama)}</h3><div class="desc">Setoran rutin supaya investasi berjalan disiplin. Masuk ke Jadwal dan statusnya terlihat tiap periode. Setorannya tetap kamu konfirmasi sendiri, tidak otomatis.</div>
  <form class="form"><div class="form cols2">${F('Jumlah per setoran (Rp)', `<input type="number" name="jumlah" min="0" step="1000" value="${p.jumlah}" required inputmode="numeric">`)}${F('Frekuensi', `<select name="frek"><option value="mingguan" ${p.frek!=='bulanan'?'selected':''}>Mingguan</option><option value="bulanan" ${p.frek==='bulanan'?'selected':''}>Bulanan</option></select>`)}
  ${F('Hari (kalau mingguan)', `<select name="hari">${[1,2,3,4,5,6,0].map(d => `<option value="${d}" ${+p.hari===d?'selected':''}>${HARI[d]}</option>`).join('')}</select>`)}${F('Tanggal (kalau bulanan)', `<input type="number" name="tanggal" min="1" max="28" value="${p.tanggal||1}">`)}
  ${F('Jam pengingat', `<input type="time" name="jam" value="${p.jam||'10:15'}">`)}<label class="row small muted" style="cursor:pointer;gap:8px;align-self:end;padding-bottom:10px"><input type="checkbox" name="aktif" ${p.aktif!==false?'checked':''}> Rencana aktif</label></div>
  <div class="actions" style="justify-content:space-between">${a.dca?`<button type="button" class="btn danger" id="dcaHapus">Hapus rencana</button>`:'<span></span>'}<span class="row"><button type="button" class="btn ghost" data-close>Batal</button><button class="btn primary" type="submit">Simpan</button></span></div></form>`,
  async d => { a.dca = { jumlah:+d.jumlah||0, frek:d.frek, hari:+d.hari, tanggal:Math.min(28, Math.max(1, +d.tanggal||1)), jam:d.jam||'09:30', aktif:d.aktif==='on' };
    await store.set('keuangan/aset', S.aset); toast(`Rencana DCA ${a.nama} disimpan, masuk ke Jadwal`); render(); });
  const h = document.getElementById('dcaHapus'); if (h) h.onclick = async () => { delete a.dca; await store.set('keuangan/aset', S.aset); $('#modalBg').classList.remove('show'); toast('Rencana DCA dihapus'); render(); };
}

/* kolom input cepat: dipakai di Keuangan (lengkap) dan Hari ini (ringkas, tanggal = hari ini) */
function formCepat(ringkas){
  return `<form class="quick ${ringkas?'compact':''}" data-form="tx" autocomplete="off">
    ${ringkas ? '' : `<input type="date" name="tanggal" value="${todayKey()}" max="${todayKey()}" required aria-label="Tanggal">`}
    <input type="text" name="ket" required placeholder="${ringkas?'Catat pengeluaran: makan, bensin…':'Keterangan: makan siang, bensin, gaji…'}" aria-label="Keterangan">
    <input type="number" name="jumlah" min="1" step="1" required placeholder="Rp" aria-label="Jumlah" inputmode="numeric">
    <select name="kategori" aria-label="Kategori">${KAT_TX.map(k=>`<option ${k==='Kebutuhan'?'selected':''}>${k}</option>`).join('')}</select>
    <button class="btn primary" type="submit">Catat</button></form>`;
}

  else {
    const A = S.aset.aset||[], U = S.aset.utang||[]; const ta = totalAset(), tu = totalUtang(), kb = ta - tu;
    const byKat = {}; A.forEach(a => byKat[a.kategori||'Lainnya'] = (byKat[a.kategori||'Lainnya']||0) + (+a.nilai||0));

function modal(html, onSubmit){
  const bg = $('#modalBg'), m = $('#modal'); m.innerHTML = html; bg.classList.add('show');
  const f = m.querySelector('form'); const close = () => { bg.classList.remove('show'); m.innerHTML=''; };
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  if (f) f.onsubmit = async e => { e.preventDefault(); const fd = new FormData(f); const data = Object.fromEntries(fd.entries()); const ok = await onSubmit(data, fd); if (ok!==false) close(); };
  setTimeout(() => { const first = m.querySelector('input,textarea,select'); if (first) first.focus(); }, 30);
}

  const barTamu = tamu ? `<div class="tamu"><div class="t"><b>Ini contoh isi Markas.</b> Semua angka di sini data contoh. Masuk atau daftar (gratis) untuk mengisi dan menyimpan data sendiri.</div><div class="a"><button class="btn ghost" data-act="masuk">Masuk</button><button class="btn primary" data-act="daftar">Daftar</button></div></div>` : '';
  $('#main').innerHTML = barTamu + fn();

  $('#nav').innerHTML = navHtml; $('#mnav').innerHTML = navHtml;

/* penjaga tamu: boleh lihat & berpindah halaman, tapi setiap upaya mengisi/mengubah diarahkan ke Masuk/Daftar */
const AKSI_BEBAS = new Set(['tab','jurnal-hari-ini','jurnal-buka','jadwal-geser','masuk','daftar','keluar','mode-coba','lupa-sandi']);
const FIELD_BEBAS = new Set(['sholatBulan','bulanTx','jurnalTgl','rencanaKat']);
const diModal = el => !!el.closest('#modal');
document.addEventListener('click', e => { if (!tamu) return; const el = e.target.closest('[data-act]'); if (!el || diModal(el) || AKSI_BEBAS.has(el.dataset.act)) return; e.preventDefault(); e.stopImmediatePropagation(); vMasuk('Masuk atau daftar dulu untuk mengisi bagian ini.'); }, true);
document.addEventListener('focusin', e => { if (!tamu) return; const el = e.target; if (!['INPUT','TEXTAREA','SELECT'].includes(el.tagName) || diModal(el) || FIELD_BEBAS.has(el.dataset.field)) return; el.blur(); vMasuk('Masuk atau daftar dulu untuk mengisi bagian ini.'); }, true);
document.addEventListener('change', e => { if (!tamu) return; const el = e.target; if (diModal(el) || FIELD_BEBAS.has(el.dataset.field)) return; e.stopImmediatePropagation(); vMasuk('Masuk atau daftar dulu untuk mengisi bagian ini.'); }, true);
document.addEventListener('submit', e => { if (!tamu) return; if (diModal(e.target)) return; e.preventDefault(); e.stopImmediatePropagation(); vMasuk('Masuk atau daftar dulu supaya isianmu tersimpan.'); }, true);

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName==='INPUT' && (el.type==='range'||el.type==='number'||el.type==='checkbox')) return; // ditangani change
  switch (act) {
    case 'sholat-status': { const k = el.dataset.tgl||todayKey(); const h = hari(k); const cur = statusSholat(k); let v = el.dataset.v;
      if (v==='cycle') v = cur==='' ? 'lengkap' : cur==='lengkap' ? 'bolos' : ''; else if (v===cur) v = '';
      h.sholat = v ? { status:v } : {}; await simpanHari(k,h); if (v==='lengkap') toast('Alhamdulillah, lengkap 5 waktu'); else if (v==='bolos') toast('Tercatat bolos. Besok lebih baik.', true); render(); break; }
    case 'kebiasaan': { const k = todayKey(); const h = hari(k); h.kebiasaan = h.kebiasaan||{}; h.kebiasaan[id] = !h.kebiasaan[id]; await simpanHari(k,h); render(); break; }
    case 'mood': { const k = S.view==='jurnal' ? S.jurnalTgl : todayKey(); const h = hari(k); h.jurnal = h.jurnal||{}; h.jurnal.mood = h.jurnal.mood===el.dataset.v ? '' : el.dataset.v; await simpanHari(k,h); render(); break; }
    case 'langgar': modalLanggar(); break;
    case 'langgar-hapus': { const h = hari(el.dataset.tgl); h.pelanggaran = (h.pelanggaran||[]).filter(p=>p.id!==id); await simpanHari(el.dataset.tgl,h); toast('Catatan pelanggaran dihapus'); render(); break; }
    case 'aturan-tambah': modalAturan(); break;
    case 'aturan-edit': modalAturan(S.pengaturan.aturan.find(a=>a.id===id)); break;
    case 'aturan-hapus': if (confirm('Hapus aturan ini?')) { S.pengaturan.aturan = S.pengaturan.aturan.filter(a=>a.id!==id); await store.set('pengaturan/utama', S.pengaturan); render(); } break;
    case 'pengaturan': modalPengaturan(); break;
    case 'masuk': e.preventDefault(); vMasuk('', 'masuk'); break;
    case 'daftar': e.preventDefault(); vMasuk('', 'daftar'); break;
    case 'keluar': if (pengguna) await sb.auth.signOut(); localStorage.removeItem(LS+'mode-coba'); location.reload(); break;
    case 'jurnal-hari-ini': S.jurnalTgl = todayKey(); render(); break;
    case 'jurnal-buka': S.jurnalTgl = el.dataset.tgl; render(); window.scrollTo(0,0); break;
    case 'kuliah-hapus': S.kuliah.items = S.kuliah.items.filter(c=>c.id!==id); await store.set('kuliah/semester5', S.kuliah); render(); break;
    case 'rencana-tambah': modalRencana(); break;
    case 'rencana-edit': modalRencana(S.rencana.items.find(x=>x.id===id)); break;
    case 'rencana-hapus': if (confirm('Hapus target ini?')) { S.rencana.items = S.rencana.items.filter(x=>x.id!==id); await store.set('rencana/3tahun', S.rencana); render(); } break;
    case 'keputusan-hapus': if (confirm('Hapus keputusan ini?')) { S.keputusan.items = S.keputusan.items.filter(x=>x.id!==id); await store.set('keputusan/daftar', S.keputusan); render(); } break;
    case 'keputusan-hasil': modalHasil(S.keputusan.items.find(x=>x.id===id)); break;
    case 'fokus-hapus': { const x = S.fokus.items.find(y=>y.id===id); if (confirm(`Hapus "${x.judul}"? Hapus hanya kalau memang sudah selesai atau tidak relevan lagi.`)) { S.fokus.items = S.fokus.items.filter(y=>y.id!==id); await store.set('fokus/daftar', S.fokus); toast('Dihapus. Satu beban berkurang.'); render(); } break; }
    case 'fokus-pulihkan': { DEF.fokus.items.forEach(d => { if (!S.fokus.items.some(x=>x.id===d.id)) S.fokus.items.push(clone(d)); }); await store.set('fokus/daftar', S.fokus); render(); break; }
    case 'fokus-goyah': { const x = S.fokus.items.find(y=>y.id===id); x.terakhir = todayKey(); await store.set('fokus/daftar', S.fokus); toast('Direset ke 0. Besok mulai lagi, tidak apa-apa.', true); render(); break; }
    case 'tab': S.tab[el.dataset.k] = el.dataset.v; render(); break;
    case 'tx-hapus': { const t = S.aruskas.transaksi.find(x=>x.id===id); if (!t) break;
      if (t.setoran) { if (confirm(`Batalkan setoran ${rp(t.keluar)}? Nilai aset juga dikurangi kembali.`)) { await batalSetor(t.setoran); render(); } break; }
      if (t.hutang && !confirm(`Batalkan pembayaran hutang ${rp(t.keluar)} tanggal ${fmtTgl(t.tanggal,false)}? Sisa hutang akan dikembalikan.`)) break;
      S.aruskas.transaksi = S.aruskas.transaksi.filter(x=>x.id!==id);
      if (t.rutin) { const r = (S.aruskas.rutin||[]).find(x=>x.id===t.rutin); if (r) { r.lewati = r.lewati||[]; if (!r.lewati.includes(t.tanggal)) r.lewati.push(t.tanggal); } }
      const tulis = [store.set('keuangan/aruskas', S.aruskas)];
      if (t.hutang) { const u = (S.aset.utang||[]).find(x=>x.id===t.hutang); if (u) { u.nilai = (+u.nilai||0) + (+t.keluar||0); tulis.push(store.set('keuangan/aset', S.aset)); } }
      await Promise.all(tulis); toast(t.hutang ? 'Pembayaran dibatalkan, sisa hutang dikembalikan' : t.rutin ? 'Minggu ini dilewati' : 'Transaksi dihapus'); render(); break; }
    case 'rutin-tambah': modalRutin(); break;
    case 'blok': await klikBlok(el.dataset.link, el.dataset.tgl); break;
    case 'jadwal-tambah': modalJadwal(); break;
    case 'jadwal-edit': modalJadwal(clone(S.jadwal.items.find(x=>x.id===id))); break;
    case 'jadwal-hapus': if (confirm('Hapus kegiatan ini dari jadwal?')) { S.jadwal.items = S.jadwal.items.filter(x=>x.id!==id); await store.set('jadwal/rutinitas', S.jadwal); toast('Dihapus dari jadwal'); render(); } break;
    case 'jadwal-geser': S.jadwalOff = +el.dataset.v===0 ? 0 : (S.jadwalOff||0) + (+el.dataset.v); render(); break;
    case 'setor': modalSetor(id); break;
    case 'dca': modalDCA(id); break;
    case 'setor-batal': if (confirm('Batalkan setoran ini? Nilai aset dikurangi kembali dan catatan arus kasnya dihapus.')) { await batalSetor(id); render(); } break;
    case 'rutin-hapus': if (confirm('Hapus aturan rutin ini? Baris yang sudah tercatat tetap ada.')) { S.aruskas.rutin = S.aruskas.rutin.filter(x=>x.id!==id); await store.set('keuangan/aruskas', S.aruskas); render(); } break;
    case 'bulan-manual': modalBulanManual(); break;
    case 'aset-tambah': modalAset(); break;
    case 'utang-tambah': modalUtang(); break;
    case 'aset-hapus': S.aset.aset = S.aset.aset.filter(a=>a.id!==id); await store.set('keuangan/aset', S.aset); render(); break;
    case 'utang-hapus': S.aset.utang = S.aset.utang.filter(a=>a.id!==id); await store.set('keuangan/aset', S.aset); render(); break;
    case 'riwayat-simpan': { S.aset.riwayat = S.aset.riwayat||{}; S.aset.riwayat[monthKey(new Date())] = totalAset(); await store.set('keuangan/aset', S.aset); toast('Nilai bulan ini disimpan ke riwayat'); render(); break; }
  }
});

document.addEventListener('change', async e => {
  const el = e.target; const act = el.dataset.act, id = el.dataset.id, field = el.dataset.field;
  if (act==='rencana-progres') { const x = S.rencana.items.find(y=>y.id===id); x.progres = +el.value; await store.set('rencana/3tahun', S.rencana); render(); }
  else if (act==='rencana-selesai') { const x = S.rencana.items.find(y=>y.id===id); x.selesai = el.checked; if (el.checked) x.progres = 100; await store.set('rencana/3tahun', S.rencana); render(); }
  else if (act==='aset-nilai') { const a = S.aset.aset.find(y=>y.id===id); a.nilai = +el.value; await store.set('keuangan/aset', S.aset); toast('Nilai aset diperbarui'); render(); }
  else if (act==='utang-nilai') { const a = S.aset.utang.find(y=>y.id===id); a.nilai = +el.value; await store.set('keuangan/aset', S.aset); toast('Sisa utang diperbarui'); render(); }
  else if (act==='fokus-field') { const x = S.fokus.items.find(y=>y.id===id); x[el.dataset.k] = el.value; await store.set('fokus/daftar', S.fokus); toast('Tersimpan'); if (el.tagName!=='TEXTAREA') render(); }
  else if (act==='fokus-angka') { S.fokus[el.dataset.k] = +el.value||0; await store.set('fokus/daftar', S.fokus); render(); }
  else if (act==='rutin-aktif' || act==='rutin-field') { const r = S.aruskas.rutin.find(y=>y.id===id); if (!r) return;
    if (act==='rutin-aktif') r.aktif = el.checked; else { const k = el.dataset.k; r[k] = k==='ff' ? el.checked : (k==='jumlah'||k==='hari') ? +el.value||0 : el.value; }
    await store.set('keuangan/aruskas', S.aruskas); const n = await jalankanRutin();
    toast(act==='rutin-aktif' ? (r.aktif ? `${r.nama} aktif${n?`, ${n} minggu tercatat`:''}` : `${r.nama} dimatikan`) : `Disimpan${n?`, ${n} minggu tercatat`:''}`); render(); }
  else if (act==='fokus-selesai') { const x = S.fokus.items.find(y=>y.id===id); x.selesai = el.checked; await store.set('fokus/daftar', S.fokus); render(); }
  else if (field==='sholatBulan') { S.tab.sholatBulan = el.value; render(); }
  else if (field==='bulanTx') { S.bulanTx = el.value; render(); }
  else if (field==='jurnalTgl') { S.jurnalTgl = el.value; render(); }
  else if (field==='rencanaKat') { S.tab.rencanaKat = el.value; render(); }
});

// jurnal: simpan otomatis saat berhenti mengetik
let jurnalTimer;
document.addEventListener('input', e => {
  const el = e.target; const field = el.dataset.field; if (!field || !field.startsWith('jurnal.')) return;
  clearTimeout(jurnalTimer);
  jurnalTimer = setTimeout(async () => { const k = S.view==='jurnal' ? S.jurnalTgl : todayKey(); const h = hari(k); h.jurnal = h.jurnal||{}; h.jurnal[field.split('.')[1]] = el.value; if (await simpanHari(k,h)) toast('Jurnal tersimpan'); }, 900);
});

document.addEventListener('submit', async e => {
  const f = e.target; const which = f.dataset.form; if (!which) return; e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  if (which==='kuliah') { S.kuliah.items = (S.kuliah.items||[]).filter(c=>!c.contoh); S.kuliah.items.push({ id:uid(), hari:+d.hari, mulai:d.mulai, selesai:d.selesai, mk:d.mk, ruang:d.ruang, dosen:d.dosen }); await store.set('kuliah/semester5', S.kuliah); toast('Sesi kuliah ditambahkan'); }
  else if (which==='fokus') { S.fokus.items = S.fokus.items||[]; S.fokus.items.push({ id:uid(), jenis:d.jenis, judul:d.judul, tenggat:d.tenggat||'', catatan:d.catatan||'', selesai:false }); await store.set('fokus/daftar', S.fokus); toast('Ditambahkan'); }
  else if (which==='keputusan') { S.keputusan.items = S.keputusan.items||[]; S.keputusan.items.push({ id:uid(), tanggal:d.tanggal, keputusan:d.keputusan, alasan:d.alasan, alternatif:d.alternatif, tinjau:d.tinjau, hasil:'', status:'' }); await store.set('keputusan/daftar', S.keputusan); toast('Keputusan dicatat'); }
  else if (which==='tx') { const tgl = d.tanggal || todayKey(); const j = Math.round(+d.jumlah||0); const masuk = d.kategori==='Pemasukan';
    S.aruskas.transaksi.push({ id:uid(), tanggal:tgl, ket:d.ket, kategori:d.kategori, masuk: masuk?j:0, keluar: masuk?0:j });
    S.bulanTx = tgl.slice(0,7); await store.set('keuangan/aruskas', S.aruskas);
    const r = ringkasBulan(S.bulanTx); toast(`${masuk?'Masuk':'Keluar'} ${rp(j)} · pengeluaran ${fmtBulan(S.bulanTx)} jadi ${rp(r.pengeluaran)}`); S.fokusCepat = true; }
  else if (which==='bayar') { if (!(await bayarHutang(d))) return; }
  render();
  if (S.fokusCepat) { S.fokusCepat = false; if (S.view==='keuangan') { const i = document.querySelector('form[data-form="tx"] [name="ket"]'); if (i) i.focus(); } }
});

/* ---------- mulai ---------- */
(async () => {
  $('#main').innerHTML = '<div class="empty" style="margin-top:40px">Memuat…</div>';
  await store.init();
  await loadAll(); if (!tamu) await jalankanRutin(); route();
  if (tamu) { /* lihat-lihat dulu; Masuk/Daftar ada di bar atas & pojok kiri bawah */ }
  else if (!S.pengaturan.nama) { const n = localStorage.getItem(LS+'nama-daftar') || ''; if (n) { S.pengaturan.nama = n; await store.set('pengaturan/utama', S.pengaturan); render(); } else { toast('Isi nama dan kotamu dulu'); modalPengaturan(); } }
  if ('serviceWorker' in navigator && (location.hostname.endsWith('github.io') || location.hostname.endsWith('markasku.my.id'))) navigator.serviceWorker.register('sw.js').catch(() => {});
  setInterval(async () => { const baru = await jalankanRutin(); const sibuk = $('#modalBg').classList.contains('show') || ['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName); if (!sibuk && (S.view==='hari-ini' || baru)) render(); }, 60000);
})();
