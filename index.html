/* ----- Keuangan ----- */
const awalMinggu =k => { const d = parseKey(k); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return key(d); }; // Senin
const labelMinggu = ws => { const a = parseKey(ws), b = parseKey(addDays(ws,6)); return a.getMonth()===b.getMonth() ? `${a.getDate()}–${b.getDate()} ${BLN[b.getMonth()]}` : `${a.getDate()} ${BLN[a.getMonth()]} – ${b.getDate()} ${BLN[b.getMonth()]}`; };
const txHutang = () => (S.aruskas.transaksi||[]).filter(t => t.hutang);
const bayarMinggu = ws => { const we = addDays(ws,6); return txHutang().filter(t => t.tanggal>=ws && t.tanggal<=we).reduce((n,t)=>n+(+t.keluar||0),0); };
const jumlahKeluar = list => list.reduce((n,t)=>n+(+t.keluar||0),0);

/* setoran ke aset yang sudah ada (seperti DCA): nilai aset bertambah, tercatat di riwayat setoran,
   dan (opsional) di arus kas sebagai Tabungan & investasi. Membatalkan = semuanya dikembalikan. */
function statusDCA(a, k){
  const p = a.dca; if (!p || !p.aktif || !(+p.jumlah>0)) return null; k = k || todayKey();
  const dari = p.frek==='bulanan' ? k.slice(0,7)+'-01' : awalMinggu(k), sampai = p.frek==='bulanan' ? k.slice(0,7)+'-31' : addDays(dari, 6);
  const sudah = (S.aset.setoran||[]).filter(s => s.aset===a.id && s.tanggal>=dari && s.tanggal<=sampai).reduce((n,s) => n + (+s.jumlah||0), 0);
  return { sudah, target:+p.jumlah, ok: sudah >= +p.jumlah, periode: p.frek==='bulanan' ? 'bulan ini' : 'minggu ini' };
}
const jadwalDCA = p => p.frek==='bulanan' ? `tiap tanggal ${Math.min(+p.tanggal||1,28)}` : `tiap ${HARI[+p.hari]}`;
async function setorAset(d){
  const a = (S.aset.aset||[]).find(x => x.id===d.aset); if (!a) { toast('Pilih asetnya dulu', true); return false; }
  const j = Math.round(+d.jumlah||0); if (!(j>0)) { toast('Isi jumlah setoran', true); return false; }
  const id = uid(), tgl = d.tanggal || todayKey(), keArus = d.arus==='on';
  a.nilai = (+a.nilai||0) + j; a.disetor = (+a.disetor||0) + j;
  S.aset.setoran.push({ id, tanggal:tgl, aset:a.id, jumlah:j, catatan:d.catatan||'', arus:keArus });
  const tulis = [store.set('keuangan/aset', S.aset)];
  if (keArus) { S.aruskas.transaksi.push({ id:'setor-'+id, tanggal:tgl, ket:`Setor ${a.nama}${d.catatan?' · '+d.catatan:''}`, kategori:'Tabungan', masuk:0, keluar:j, aset:a.id, setoran:id }); tulis.push(store.set('keuangan/aruskas', S.aruskas)); }
  await Promise.all(tulis); toast(`${a.nama} bertambah ${rp(j)} → ${rp(a.nilai)}`); return true;
}
async function batalSetor(sid){
  const s = (S.aset.setoran||[]).find(x => x.id===sid); if (!s) return;
  const a = (S.aset.aset||[]).find(x => x.id===s.aset); if (a) { a.nilai = Math.max(0, (+a.nilai||0) - s.jumlah); a.disetor = Math.max(0, (+a.disetor||0) - s.jumlah); }
  S.aset.setoran = S.aset.setoran.filter(x => x.id!==sid); S.aruskas.transaksi = S.aruskas.transaksi.filter(t => t.setoran!==sid);
  await Promise.all([store.set('keuangan/aset', S.aset), store.set('keuangan/aruskas', S.aruskas)]); toast('Setoran dibatalkan, nilai aset dikembalikan');
}
function modalSetor(asetId){

  const a = A.find(x => x.id===asetId) || A[0]; const saran = a.dca && +a.dca.jumlah ? a.dca.jumlah : '';
  modal(`<h3>Setor ke aset</h3><div class="desc">Menambah nilai aset yang sudah ada, seperti DCA. Tidak membuat aset baru.</div>

  <div class="form cols2">${F('Jumlah (Rp)', `<input type="number" name="jumlah" min="1" step="1" value="${saran}" required inputmode="numeric" style="font-family:var(--mono)">`)}${F('Tanggal', `<input type="date" name="tanggal" value="${todayKey()}" max="${todayKey()}" required>`)}</div>
  ${F('Catatan', `<input type="text" name="catatan" placeholder="opsional, misal: beli di harga turun">`)}
  <label class="row small muted" style="cursor:pointer;gap:8px"><input type="checkbox" name="arus" checked> Catat juga di arus kas sebagai Tabungan & investasi (uangnya keluar dari kas)</label>${ACTIONS('Setor')}</form>`,
  async d => { const ok = await setorAset(d); if (ok) render(); return ok; });

function modalDCA(asetId){

  modal(`<h3>Rencana DCA · ${esc(a.nama)}</h3><div class="desc">Setoran rutin supaya investasi berjalan disiplin. Masuk ke Jadwal dan statusnya terlihat tiap periode. Setorannya tetap kamu konfirmasi sendiri, tidak otomatis.</div>
  <form class="form"><div class="form cols2">${F('Jumlah per setoran (Rp)', `<input type="number" name="jumlah" min="0" step="1000" value="${p.jumlah}" required inputmode="numeric">`)}${F('Frekuensi', `<select name="frek"><option value="mingguan" ${p.frek!=='bulanan'?'selected':''}>Mingguan</option><option value="bulanan" ${p.frek==='bulanan'?'selected':''}>Bulanan</option></select>`)}
  ${F('Hari (kalau mingguan)', `<select name="hari">${[1,2,3,4,5,6,0].map(d => `<option value="${d}" ${+p.hari===d?'selected':''}>${HARI[d]}</option>`).join('')}</select>`)}${F('Tanggal (kalau bulanan)', `<input type="number" name="tanggal" min="1" max="28" value="${p.tanggal||1}">`)}
  ${F('Jam pengingat', `<input type="time" name="jam" value="${p.jam||'10:15'}">`)}<label class="row small muted" style="cursor:pointer;gap:8px;align-self:end;padding-bottom:10px"><input type="checkbox" name="aktif" ${p.aktif!==false?'checked':''}> Rencana aktif</label></div>
  <div class="actions" style="justify-content:space-between">${a.dca?`<button type="button" class="btn danger" id="dcaHapus">Hapus rencana</button>`:'<span></span>'}<span class="row"><button type="button" class="btn ghost" data-close>Batal</button><button class="btn primary" type="submit">Simpan</button></span></div></form>`,
  async d => { a.dca = { jumlah:+d.jumlah||0, frek:d.frek, hari:+d.hari, tanggal:Math.min(28, Math.max(1, +d.tanggal||1)), jam:d.jam||'09:30', aktif:d.aktif==='on' };
    await store.set('keuangan/aset', S.aset); toast(`Rencana DCA ${a.nama} disimpan, masuk ke Jadwal`); render(); });
  const h = document.getElementById('dcaHapus'); if (h) h.onclick = async () => { delete a.dca; await store.set('keuangan/aset', S.aset); $('#modalBg').classList.remove('show'); toast('Rencana DCA dihapus'); render(); };

function modal(html, onSubmit){
  const bg = $('#modalBg'), m = $('#modal'); m.innerHTML = html; bg.classList.add('show');
  const f = m.querySelector('form'); const close = () => { bg.classList.remove('show'); m.innerHTML=''; };
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  if (f) f.onsubmit = async e => { e.preventDefault(); const fd = new FormData(f); const data = Object.fromEntries(fd.entries()); const ok = await onSubmit(data, fd); if (ok!==false) close(); };
  setTimeout(() => { const first = m.querySelector('input,textarea,select'); if (first) first.focus(); }, 30);
}

async function muatNilai(){
  const box = $('#nilaiMarkas'); if (!box || !sb) return;
  const { data, error } = await sb.rpc('nilai_markas'); if (error || !data) return;
  const suka = +data.suka||0, tidak = +data.tidak||0, total = suka + tidak;
  box.querySelector('[data-n=suka]').textContent = suka; box.querySelector('[data-n=tidak]').textContent = tidak;
  box.querySelector('[data-n=ringkas]').textContent = total ? `${Math.round(suka/total*100)}% suka · ${total} suara` : 'Belum ada suara';
}
async function kirimNilai(suka){
  if (!sb) return; const pengenal = pengenalNilai();
  const { error } = await sb.rpc('kirim_nilai', { p_pengenal: pengenal, p_suka: suka });
  if (error) return toast('Gagal menyimpan: ' + error.message, true);
  try { localStorage.setItem(LS+'nilai', suka ? '1' : '0'); } catch {}
  toast(suka ? 'Terima kasih! 👍' : 'Terima kasih sudah jujur. Tulis apa yang kurang di bawah, itu yang paling membantu.');
  render(); if (!suka) { const f = document.querySelector('form[data-form="masukan"]'); if (f) { f.jenis.value = 'kritik'; f.pesan.placeholder = 'Apa yang kurang atau mengganggu? Sejelas mungkin.'; f.pesan.focus(); } }
}
async function muatMasukan(){

/* ----- Bugar: makan, latihan, berat badan -----------------------------------
   Takaran memakai tangan sendiri, bukan gram. Alasannya praktis: makanan rumahan
   dan makanan khas daerah tidak punya label gizi, dan orang yang harus menimbang
   tiap makan biasanya berhenti dalam dua minggu. Ukuran tangan juga otomatis
   menyesuaikan besar badan pemiliknya.
     satu telapak tangan  = protein (ikan, ayam, telur, tempe)
     satu kepal tangan    = karbohidrat (nasi, mie, bihun, kentang, sagu)
     satu ruas jempol     = lemak tambahan (minyak, santan, kacang)
     dua genggam          = sayur
   Makanan bersantan atau digoreng rendam dihitung dua jempol.                */
const TAKARAN = [
  ['telapak', 'Protein',       'telapak tangan', 'ikan, ayam, telur, tempe, tahu'],
  ['kepal',   'Karbohidrat',   'kepal tangan',   'nasi, mie tiaw, bihun, kentang, sagu'],
  ['jempol',  'Lemak tambahan','ruas jempol',    'minyak goreng, santan, kacang'],
  ['sayur',   'Sayur',         'genggam',        'apa saja, makin banyak makin baik']
];
const TUJUAN = { turun:['Turunkan berat', -500], jaga:['Jaga berat', 0], naik:['Naikkan berat', 300] };
const AKTIVITAS = [
  [1.2,   'Hampir selalu duduk'],
  [1.375, 'Gerak ringan, olahraga 1–3 hari seminggu'],
  [1.55,  'Gerak sedang, olahraga 3–5 hari seminggu'],
  [1.725, 'Kerja fisik atau olahraga hampir tiap hari']
];

const beratTerakhir = () => { const d = (S.bugar.berat||[]).slice().sort((a,b)=>a.tgl.localeCompare(b.tgl)); return d.length ? d[d.length-1].kg : 0; };

// Semua angka gizi dihitung di sini, satu tempat, supaya tidak ada angka ajaib
// yang tersebar di tampilan.
function angkaBugar(){
  const p = S.bugar.profil || {}, berat = beratTerakhir();
  if (!p.tinggi || !p.umur || !berat) return null;
  const bmr = Math.round(10 * berat + 6.25 * p.tinggi - 5 * p.umur + (p.kelamin === 'p' ? -161 : 5));
  const tdee = Math.round(bmr * (+p.aktivitas || 1.375));
  const kalori = Math.max(1200, tdee + (TUJUAN[p.tujuan] || TUJUAN.jaga)[1]);
  const protein = Math.round(1.6 * berat);            // cukup untuk menahan otot saat defisit
  const lemak = Math.round(0.8 * berat);              // batas bawah supaya hormon tidak terganggu
  const karbo = Math.max(50, Math.round((kalori - protein * 4 - lemak * 9) / 4));
  const t = p.tinggi / 100, imt = +(berat / (t * t)).toFixed(1);
  return { berat, bmr, tdee, kalori, protein, lemak, karbo, imt,
    sehatBawah: Math.round(18.5 * t * t), sehatAtas: Math.round(24.9 * t * t),
    jatah: {
      telapak: Math.max(2, Math.round(protein / 30)),
      kepal:   Math.max(2, Math.round(karbo / 50)),
      jempol:  Math.max(1, Math.round(lemak * .5 / 12)),
      sayur:   3
    } };
}

const bacaIMT = v => v < 18.5 ? ['Kurang', 'var(--warn)'] : v < 25 ? ['Sehat', 'var(--good)'] : v < 30 ? ['Berlebih', 'var(--warn)'] : ['Obesitas', 'var(--bad)'];

// Grafik berat sederhana: garis dari timbangan pertama sampai terakhir.
function grafikBerat(data, target){
  if (data.length < 2) return '';
  const W = 320, H = 96, pad = 10;
  const nilai = data.map(d => d.kg).concat(target ? [target] : []);
  const min = Math.min(...nilai) - 1, max = Math.max(...nilai) + 1, rentang = (max - min) || 1;
  const x = i => pad + (W - pad * 2) * (i / (data.length - 1));
  const y = v => pad + (H - pad * 2) * (1 - (v - min) / rentang);
  const garis = data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(d.kg).toFixed(1)}`).join('');
  const titik = data.map((d, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(d.kg).toFixed(1)}" r="2.4" fill="var(--teal)"/>`).join('');
  const garisTarget = target ? `<line x1="${pad}" y1="${y(target).toFixed(1)}" x2="${W - pad}" y2="${y(target).toFixed(1)}" stroke="var(--gold)" stroke-width="1" stroke-dasharray="3 3"/>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik berat badan">${garisTarget}<path d="${garis}" fill="none" stroke="var(--teal)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${titik}</svg>`;
}


/* Mencari celah kosong untuk latihan.
   Pengguna bilang jadwal lamanya tidak pernah ia bolos atau langgar, jadi latihan
   baru tidak boleh menabraknya: yang menyelip di jadwal yang sudah jalan pasti
   kalah dan akhirnya ditinggalkan. Fungsi ini mencoba beberapa titik pegangan
   (setelah Ashar dulu, lalu Isya, Subuh, Maghrib) dan menggeser jedanya lima menit
   demi lima menit sampai ketemu jendela yang benar-benar kosong DI SEMUA HARI
   latihan itu, bukan cuma di satu hari. Waktu sholat dihitung dari tanggal terdekat
   yang jatuh pada hari tersebut. */
// Sore dan malam dicoba lebih dulu. Pagi ditaruh paling belakang karena buat
// kebanyakan orang pagi itu jam paling padat.
const PEGANGAN = ['ashar', 'maghrib', 'isya', 'subuh'];
function celahBersama(hariList, durasi){
  if (!hariList || !hariList.length) return null;
  const info = hariList.map(dow => {
    const d = new Date(); d.setDate(d.getDate() + ((dow - d.getDay()) + 7) % 7);
    return { wt: waktuSholat(d, S.pengaturan.lat, S.pengaturan.lng), isi: blokHari(key(d)).map(b => [b.m0, b.m1]) };
  });
  for (const sh of PEGANGAN) {
    for (let jeda = 0; jeda <= 180; jeda += 5) {
      const muat = info.every(({ wt, isi }) => {
        if (wt[sh] === undefined) return false;
        const m0 = wt[sh] + 15 + jeda;            // 15 menit untuk sholatnya sendiri
        if (m0 + durasi > 22 * 60) return false;  // jangan sampai lewat jam 10 malam
        return !isi.some(([a, b]) => m0 < b && a < m0 + durasi);
      });
      if (muat) return { setelah: sh, jeda };
    }
  }
  return null;
}

}

  else if (act==='fokus-selesai') { const x = S.fokus.items.find(y=>y.id===id); x.selesai = el.checked; await store.set('fokus/daftar', S.fokus); render(); }
  else if (field==='sholatBulan') { S.tab.sholatBulan = el.value; render(); }
  else if (field==='bulanTx') { S.bulanTx = el.value; render(); }
  else if (field==='jurnalTgl') { S.jurnalTgl = el.value; render(); }
  else if (field==='rencanaKat') { S.tab.rencanaKat = el.value; render(); }
  else if (field==='rencanaMode') { S.pengaturan.modeRencana = el.value; render(); if (!tamu) await store.set('pengaturan/utama', S.pengaturan); }
});

// jurnal: simpan otomatis saat berhenti mengetik
let jurnalTimer;
document.addEventListener('input', e => {
  const el = e.target; const field = el.dataset.field; if (!field || !field.startsWith('jurnal.')) return;
  clearTimeout(jurnalTimer);
  jurnalTimer = setTimeout(async () => { const k = S.view==='jurnal' ? S.jurnalTgl : todayKey(); const h = hari(k); h.jurnal = h.jurnal||{}; h.jurnal[field.split('.')[1]] = el.value; if (await simpanHari(k,h)) toast('Jurnal tersimpan'); }, 900);
});

document.addEventListener('submit', async e => {
  const f = e.target; const which = f.dataset.form; if (!which) return; e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  if (which==='sandi') { if (d.sandi !== d.sandi2) return toast('Kata sandi tidak sama', true);
    const { error } = await sb.auth.updateUser({ password: d.sandi }); if (error) return toast(error.message, true); f.reset(); return toast('Kata sandi diganti'); }
  if (which==='masukan') { if (!sb) return toast('Tidak tersambung', true);
    const baris = { user_id: pengguna ? pengguna.id : null, email: pengguna ? pengguna.email : (d.email||'').trim() || null, jenis: d.jenis, pesan: d.pesan.trim(), halaman: (sessionStorage.getItem(LS+'halaman-sebelum')||'') };
    const { error } = await sb.from('markas_masukan').insert(baris); if (error) return toast('Gagal mengirim: ' + error.message, true);
    f.reset(); return toast('Terkirim. Terima kasih, pesanmu dibaca langsung oleh pembuat Markasku.'); }
  if (which==='kuliah') { S.kuliah.items = (S.kuliah.items||[]).filter(c=>!c.contoh); S.kuliah.items.push({ id:uid(), hari:+d.hari, mulai:d.mulai, selesai:d.selesai, mk:d.mk, ruang:d.ruang, dosen:d.dosen }); await store.set('kuliah/semester5', S.kuliah); toast('Sesi kuliah ditambahkan'); }
  else if (which==='fokus') { S.fokus.items = S.fokus.items||[]; S.fokus.items.push({ id:uid(), jenis:d.jenis, judul:d.judul, tenggat:d.tenggat||'', nominal:+d.nominal||0, mataUang:d.mataUang||'IDR', catatan:d.catatan||'', selesai:false }); await store.set('fokus/daftar', S.fokus); toast('Ditambahkan'); }
  else if (which==='keputusan') { S.keputusan.items = S.keputusan.items||[]; S.keputusan.items.push({ id:uid(), tanggal:d.tanggal, keputusan:d.keputusan, alasan:d.alasan, alternatif:d.alternatif, tinjau:d.tinjau, hasil:'', status:'' }); await store.set('keputusan/daftar', S.keputusan); toast('Keputusan dicatat'); }
  else if (which==='tx') { const tgl = d.tanggal || todayKey(); const j = Math.round(+d.jumlah||0); const masuk = d.kategori==='Pemasukan';
    S.aruskas.transaksi.push({ id:uid(), tanggal:tgl, ket:d.ket, kategori:d.kategori, masuk: masuk?j:0, keluar: masuk?0:j });
    S.bulanTx = tgl.slice(0,7); await store.set('keuangan/aruskas', S.aruskas);
    const r = ringkasBulan(S.bulanTx); toast(`${masuk?'Masuk':'Keluar'} ${rp(j)} · pengeluaran ${fmtBulan(S.bulanTx)} jadi ${rp(r.pengeluaran)}`); S.fokusCepat = true; }
  else if (which==='bayar') { if (!(await bayarHutang(d))) return; }
  render();
  if (S.fokusCepat) { S.fokusCepat = false; if (S.view==='keuangan') { const i = document.querySelector('form[data-form="tx"] [name="ket"]'); if (i) i.focus(); } }
});

/* ---------- mulai ---------- */
(async () => {
  $('#main').innerHTML = '<div class="empty" style="margin-top:40px">Memuat…</div>';
  await store.init();
  await loadAll(); terapkanTema(); if (!tamu) await jalankanRutin(); route();
  setInterval(cekAdzan, 20000); setInterval(() => { terapkanTema(); pasangLatar(); }, 60000); sinkronAdzanNatif(); muatMedia(); aturBahasa(bahasaAktif(), false);
  if (tamu) { /* lihat-lihat dulu; Masuk/Daftar ada di bar atas & pojok kiri bawah */ }
  else if (!S.pengaturan.nama) { const n = localStorage.getItem(LS+'nama-daftar') || ''; if (n) { S.pengaturan.nama = n; await store.set('pengaturan/utama', S.pengaturan); render(); } else { toast('Isi nama dan kotamu dulu'); modalPengaturan(); } }
  if ('serviceWorker' in navigator && (location.hostname.endsWith('github.io') || location.hostname.endsWith('markasku.my.id'))) navigator.serviceWorker.register('sw.js').catch(() => {});
  setInterval(async () => { const baru = await jalankanRutin(); const sibuk = $('#modalBg').classList.contains('show') || ['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName); if (!sibuk && (S.view==='hari-ini' || baru)) render(); }, 60000);
})();
</script>
