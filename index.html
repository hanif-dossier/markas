<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-192.png?v=5" type="image/png">
<link rel="apple-touch-icon" href="ikon-180.png?v=5">
<title>Markasku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
</head>
<body>
<style>
:root{
  color-scheme: dark;
  --bg:#0B0E14; --bg-2:#0F131C;
  --panel:#131824; --panel-2:#1A2132; --panel-3:#222B3F;
  --line:#263047; --line-2:#334060;
  --text:#EEF1F6; --muted:#8C96AA; --dim:#5C667C;
  --gold:#E3B25A; --gold-2:#F5D28A; --gold-dim:rgba(227,178,90,.14);
  --teal:#63C7BF; --teal-dim:rgba(99,199,191,.14);
  --good:#48D18A; --good-dim:rgba(72,209,138,.16);
  --warn:#F0A33C; --warn-dim:rgba(240,163,60,.16);
  --bad:#EF5D6F; --bad-dim:rgba(239,93,111,.16);
  --violet:#9B8CFF;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
}
/* Tema terang: dipakai otomatis dari terbit sampai Maghrib (pengaturan "ikut waktu"), atau kalau dipilih tetap. */
body[data-tema="terang"]{
  color-scheme: light;
  --bg:#EDF0F5; --bg-2:#F6F7FA;
  --panel:#FFFFFF; --panel-2:#F3F5F9; --panel-3:#E5E9F0;
  --line:#D8DDE7; --line-2:#C3CBDA;
  --text:#161B26; --muted:#5B6579; --dim:#8A94A8;
  --gold:#C99A32; --gold-2:#9E7418; --gold-dim:rgba(201,154,50,.14);
  --teal:#1B8F86; --teal-dim:rgba(27,143,134,.12);
  --good:#1E9E5A; --good-dim:rgba(30,158,90,.12);
  --warn:#C27A0E; --warn-dim:rgba(194,122,14,.12);
  --bad:#D23A4C; --bad-dim:rgba(210,58,76,.12);
  --violet:#5F4FD8;
  --r:14px; --r-sm:9px;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;--langit-atas:var(--bg);background:linear-gradient(180deg,var(--langit-atas) 0%,var(--bg) 46vh) fixed,var(--bg);transition:background .8s,color .6s;color:var(--text);font-family:var(--sans);font-size:14.5px;line-height:1.5;min-height:100vh}
a{color:var(--gold-2)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:12.5px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--bg-2),var(--bg));display:flex;flex-direction:column;gap:6px}
.brand{padding:4px 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand .name{font-family:var(--serif);font-size:26px;line-height:1;color:var(--gold-2)}
.brand .tag{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;border:1px solid transparent}
.nav a:hover{color:var(--text);background:var(--panel)}
.nav a.on{color:var(--text);background:var(--panel-2);border-color:var(--line)}
.nav a .ic{width:18px;height:18px;flex:none;color:var(--gold);opacity:.9}
.nav a.on .ic{color:var(--gold-2)}
.rail .foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.store{display:inline-flex;align-items:center;gap:6px}
.store i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.store.cloud i{background:var(--good);box-shadow:0 0 8px var(--good)}
.store.local i{background:var(--warn)}
main{padding:26px 30px 90px;max-width:1240px;width:100%}
html.tangkap .tamu{display:none}
html[dir=rtl] body{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,sans-serif}html[dir=rtl] .hasil-kota .hk{text-align:right}html[dir=rtl] .strip .ik,html[dir=rtl] .busur{transform:none}
.tamu{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-4px 0 18px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(90deg,rgba(227,178,90,.12),transparent)}
.tamu .t{color:var(--muted);font-size:13.5px}.tamu .t b{color:var(--gold-2)}.tamu .a{display:flex;gap:8px;flex-wrap:wrap}
.masuk-tab{display:flex;gap:6px;margin-bottom:14px}.masuk-tab button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;cursor:pointer}.masuk-tab button.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-family:var(--serif);font-size:34px;line-height:1.05;font-weight:400}
.topbar h1 em{color:var(--gold-2);font-style:italic}
.topbar .sub{color:var(--muted);margin-top:6px}

/* ---------- surfaces ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.panel.tight{padding:14px 16px}
.panel h2{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel h2 .eyebrow{font-weight:700}
.panel h2 .act{font-size:12px;font-weight:600;color:var(--gold-2);cursor:pointer;background:none;border:0;padding:0}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.tile .big{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
/* Planning: tahun → 4 kuartal */
.kuartal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kuartal{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:96px;display:flex;flex-direction:column;gap:8px}
.kuartal.past{opacity:.8}.kuartal.kini{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
.kuartal .kh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.kuartal .kh b{font-family:var(--serif);font-size:18px;font-weight:400;color:var(--gold-2)}
.kuartal .kh span{font-size:11px;color:var(--muted);white-space:nowrap}
.kuartal .goal{padding:10px 12px}
@media (max-width:980px){.kuartal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kuartal-grid{grid-template-columns:1fr}.kuartal{min-height:0}}
/* Kalender agenda bertanggal */
.kal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center;font-weight:700}
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.kal-cell{min-height:68px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line);padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.kal-cell.blank{background:transparent;border-color:transparent;cursor:default}
.kal-cell.today{border-color:var(--gold)}.kal-cell.pilih{background:var(--gold-dim);border-color:var(--gold)}
.kal-cell .d{font-family:var(--mono);font-size:12px;font-weight:600}.kal-cell.past .d{color:var(--dim)}
.kal-cell .ev{font-size:10.5px;line-height:1.2;padding:1px 4px;border-radius:4px;background:var(--panel-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--c,var(--muted))}
.kal-cell .lagi{font-size:10px;color:var(--muted)}
.kal-cell .titik{display:none;gap:3px}.kal-cell .titik i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted));display:inline-block}
@media (max-width:640px){.kal-cell{min-height:46px;padding:4px}.kal-cell .ev,.kal-cell .lagi{display:none}.kal-cell .titik{display:flex}}
.tenggat{display:flex;flex-direction:column;gap:6px}
.tenggat .it{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);font-size:13px}
.tenggat .it .pill{flex:none}
/* jempol suka / tidak */
.nilai{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2)}
.nilai .q{font-weight:700;margin-right:4px}
.nilai .btn b{font-family:var(--mono);font-weight:600;margin-left:4px;color:var(--muted)}
.nilai .btn.on{border-color:var(--gold);background:var(--gold-dim)}
.nilai .ringkas{font-size:12px;color:var(--muted);margin-left:auto}
/* langit: kepala Beranda yang warnanya mengikuti waktu sholat */
.langit{position:relative;overflow:hidden;border-radius:18px;color:#fff;padding:18px 20px 0;margin-bottom:18px;isolation:isolate;background:linear-gradient(180deg,#0A1230 0%,#16224A 60%,#2A2F5E 100%)}
.langit[data-fase="fajar"]{background:linear-gradient(180deg,#1C2356 0%,#574788 55%,#DC8B7A 100%)}
.langit[data-fase="pagi"]{background:linear-gradient(180deg,#245F9E 0%,#5E98CD 55%,#EFC58A 100%)}
.langit[data-fase="siang"]{background:linear-gradient(180deg,#1B5B9C 0%,#3F86C6 60%,#93C6E8 100%)}
.langit[data-fase="sore"]{background:linear-gradient(180deg,#22507F 0%,#B77C48 70%,#EDB35F 100%)}
.langit[data-fase="senja"]{background:linear-gradient(180deg,#211A49 0%,#843A59 55%,#E9814F 100%)}
.langit[data-fase="malam"]{background:linear-gradient(180deg,#0A1230 0%,#16224A 60%,#2A2F5E 100%)}
.langit::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity 1s;background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 42%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 46% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 63% 30%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 78% 16%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 88% 40%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 36% 24%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 70% 8%,#fff 50%,transparent 51%)}
.langit[data-fase="malam"]::before,.langit[data-fase="fajar"]::before{opacity:.85}
/* malam: lapisan bintang kedua (lebih banyak, berkelip pelan) */
.langit .bintang{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1s;
  background-image:radial-gradient(1px 1px at 5% 60%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 9% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 17% 72%,#fff 50%,transparent 51%),radial-gradient(1.1px 1.1px at 21% 10%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 25% 55%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 33% 38%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 40% 66%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 44% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 52% 48%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 57% 8%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 60% 74%,#fff 50%,transparent 51%),radial-gradient(1.1px 1.1px at 67% 36%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 73% 58%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 81% 26%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 85% 64%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 92% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 95% 46%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 13% 88%,#fff 50%,transparent 51%),radial-gradient(1.1px 1.1px at 48% 86%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 76% 84%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 30% 92%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 64% 92%,#fff 50%,transparent 51%)}
.langit[data-fase="malam"] .bintang{opacity:.9;animation:kelip 4s ease-in-out infinite alternate}
.langit[data-fase="fajar"] .bintang{opacity:.35}
@keyframes kelip{from{opacity:.55}to{opacity:1}}
/* matahari / bulan: lapisan ::after, posisinya ikut fase */
.langit::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;transition:opacity 1s}
.langit[data-fase="fajar"]::after{background:radial-gradient(ellipse 60% 45% at 22% 112%,rgba(255,176,130,.55),transparent 70%)}
.langit[data-fase="pagi"]::after{background:radial-gradient(circle at 16% 88%,#FFF6CF 0 24px,rgba(255,214,140,.9) 25px 38px,rgba(255,190,110,.45) 39px 105px,transparent 170px)}
.langit[data-fase="siang"]::after{background:radial-gradient(circle at 63% 12%,#FFFCEB 0 15px,rgba(255,250,225,.5) 16px 26px,rgba(255,250,225,.1) 27px 70px,transparent 100px)}
.langit[data-fase="sore"]::after{background:radial-gradient(circle at 82% 82%,#FFE7A6 0 30px,rgba(255,176,86,.85) 31px 48px,rgba(255,126,64,.4) 49px 135px,transparent 210px)}
.langit[data-fase="senja"]::after{background:radial-gradient(ellipse 70% 50% at 58% 112%,rgba(255,140,80,.6),transparent 70%)}
.langit[data-fase="malam"]::after{background:radial-gradient(circle at 62% 14%,#F7F2DC 0 12px,rgba(247,242,220,.35) 13px 20px,rgba(247,242,220,.08) 21px 56px,transparent 76px)}
body[data-tema="terang"] .mobile-nav{background:rgba(246,247,250,.94)}
/* ---- foto langit HD (langit/<fase>.jpg 1920px): lapisan .foto bergerak pelan (Ken Burns), bintang berkelip saat malam ---- */
.langit{text-shadow:0 1px 10px rgba(0,0,0,.4)}
.langit .foto{position:absolute;inset:-4%;z-index:-3;background-position:center 55%;background-size:cover;filter:saturate(1.2) contrast(1.06);animation:kenburns 36s ease-in-out infinite alternate;will-change:transform}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.09) translate(-1.5%,1%)}}
.langit[data-fase="fajar"] .foto{background-image:url(langit/fajar.jpg)}
.langit[data-fase="pagi"] .foto{background-image:url(langit/pagi.jpg)}
.langit[data-fase="siang"] .foto{background-image:url(langit/siang.jpg)}
.langit[data-fase="sore"] .foto{background-image:url(langit/sore.jpg)}
.langit[data-fase="senja"] .foto{background-image:url(langit/senja.jpg)}
.langit[data-fase="malam"] .foto{background-image:url(langit/malam.jpg)}
/* ::before = gradasi pelindung teks (bukan bintang lagi); bintang pindah ke .bintang di atas foto */
.langit::before{opacity:1!important;background-image:linear-gradient(180deg,rgba(6,10,26,.55) 0%,rgba(6,10,26,.12) 38%,rgba(6,10,26,.05) 60%,rgba(6,10,26,.55) 100%)!important;z-index:-2}
.langit .bintang{z-index:-1;mix-blend-mode:screen}
.langit[data-fase="malam"] .bintang{opacity:.75}
.langit::after{display:none}
.langit .masjid{opacity:.28}
.langit .strip{background:rgba(6,12,28,.45)}
.langit .aksi .btn{background:rgba(10,14,28,.38);border-color:rgba(255,255,255,.38)}
@media (prefers-reduced-motion:reduce){.langit .foto{animation:none}}
/* latar halaman hidup: versi kecil foto fase yang sama, diburamkan, dibuat lebih terasa */
body::before{content:"";position:fixed;inset:-60px;z-index:-1;pointer-events:none;background-position:center;background-size:cover;filter:blur(30px) saturate(1.35) brightness(1.05);opacity:.6;transition:opacity .8s}
body[data-tema="terang"]::before{opacity:.5;filter:blur(30px) saturate(1.25) brightness(1.15)}
body[data-fase="fajar"]::before{background-image:url(langit/fajar-kecil.jpg)}
body[data-fase="pagi"]::before{background-image:url(langit/pagi-kecil.jpg)}
body[data-fase="siang"]::before{background-image:url(langit/siang-kecil.jpg)}
body[data-fase="sore"]::before{background-image:url(langit/sore-kecil.jpg)}
body[data-fase="senja"]::before{background-image:url(langit/senja-kecil.jpg)}
body[data-fase="malam"]::before{background-image:url(langit/malam-kecil.jpg)}
body.latar-khusus::before{background-image:var(--latar-khusus)}   /* gambar pilihan pengguna (IndexedDB) menimpa bawaan */
.hasil-kota{display:flex;flex-direction:column;gap:4px;margin:-6px 0 8px}.hasil-kota .hk{text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--text);font:inherit;cursor:pointer}.hasil-kota .hk:hover{border-color:var(--gold)}
.latar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.latar-grid .lt{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel-2)}
.latar-grid .lt img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.latar-grid .lt .n{padding:6px 8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:6px}
label.btn{cursor:pointer}label.btn input[type=file]{display:none}
@media (max-width:560px){.latar-grid{grid-template-columns:repeat(2,1fr)}}
/* panel tembus sedikit lebih banyak + kaca, supaya warna latar hidup terasa tapi teks tetap terbaca */
.panel,.tile,.rail{background-color:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.tile{background-color:color-mix(in srgb,var(--panel-2) 80%,transparent)}
.rail{background-image:none}
.mobile-nav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* latar halaman ikut langit: bagian atas halaman berwarna redup sesuai fase, meluruh ke warna dasar */
body[data-fase="fajar"]{--langit-atas:#2C2548}body[data-fase="pagi"]{--langit-atas:#17325E}body[data-fase="siang"]{--langit-atas:#16375F}body[data-fase="sore"]{--langit-atas:#33273A}body[data-fase="senja"]{--langit-atas:#2E2040}body[data-fase="malam"]{--langit-atas:#0F1636}
body[data-tema="terang"][data-fase="fajar"]{--langit-atas:#EBDDE4}body[data-tema="terang"][data-fase="pagi"]{--langit-atas:#D6E5F5}body[data-tema="terang"][data-fase="siang"]{--langit-atas:#D3E3F3}body[data-tema="terang"][data-fase="sore"]{--langit-atas:#F1E0C9}body[data-tema="terang"][data-fase="senja"]{--langit-atas:#E9D5D6}body[data-tema="terang"][data-fase="malam"]{--langit-atas:#D9DCE8}
.langit .atas{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 24px;flex-wrap:wrap}
.langit .eyebrow{color:rgba(255,255,255,.82)}
.langit h1{font-family:var(--serif);font-size:34px;line-height:1.05;font-weight:400;margin:4px 0 0;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.langit h1 em{color:#F5D28A;font-style:italic}
.langit .sub{color:rgba(255,255,255,.9);margin-top:6px;max-width:62ch}
.langit .sub b{color:#fff}
.langit .kanan{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}

.langit .strip{list-style:none;margin:14px -20px 0;padding:10px 12px 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:rgba(6,12,28,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.langit .strip .n{display:block;font-size:11.5px;opacity:.82}

.langit .strip li.lewat{opacity:.5}

@media (max-width:760px){.langit{padding:16px 16px 0;border-radius:16px}.langit .strip{margin:12px -16px 0}.langit h1{font-size:28px}.langit .kanan{align-items:flex-start;text-align:left}.langit .aksi{justify-content:flex-start}}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles .tile{padding:12px 14px}.tiles .tile .big{font-size:24px}}
.check .jam{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.check .jam a{color:var(--gold-2)}
.ag.ringkas{padding:4px 8px}
.uang{font-family:var(--mono);font-size:12px;color:var(--gold-2);white-space:nowrap}
.beranda-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.beranda-sub a{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;background:var(--bg-2)}
.beranda-sub a:hover{color:var(--text);border-color:var(--gold)}
.tile .sub{font-size:12px;color:var(--dim)}
.tile.good .big{color:var(--good)}.tile.bad .big{color:var(--bad)}.tile.gold .big{color:var(--gold-2)}.tile.teal .big{color:var(--teal)}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.05),transparent 70%)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-3)}
.btn.primary{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.btn.primary:hover{background:var(--gold-2)}
.btn.danger{background:var(--bad-dim);border-color:rgba(239,93,111,.4);color:#ffb3bb}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel-2)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.icon{padding:6px;width:30px;height:30px;justify-content:center}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;color:var(--text);font-size:13.5px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{min-height:84px;resize:vertical;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.form{display:grid;gap:10px}
.form.cols2{grid-template-columns:1fr 1fr}.form.cols3{grid-template-columns:1fr 1fr 1fr}.form.cols4{grid-template-columns:repeat(4,1fr)}
.form .full{grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;border:1px solid var(--line-2);color:var(--muted);background:var(--panel-2)}
.pill.good{color:var(--good);background:var(--good-dim);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-dim);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-dim);border-color:transparent}
.pill.gold{color:var(--gold-2);background:var(--gold-dim);border-color:transparent}
.pill.teal{color:var(--teal);background:var(--teal-dim);border-color:transparent}
.pill.violet{color:var(--violet);background:rgba(155,140,255,.15);border-color:transparent}
.tabs{display:inline-flex;gap:2px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;font-weight:700;font-size:12.5px;cursor:pointer}
.tabs button.on{background:var(--panel-3);color:var(--text)}

/* checks */
.check{display:flex;align-items:center;gap:10px;padding:7px 10px;min-height:36px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg-2);cursor:pointer;user-select:none}
.check:hover{border-color:var(--line-2)}
.check .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;transition:all .15s}
.check .box svg{width:11px;height:11px;opacity:0;transform:scale(.6);transition:all .15s}
.check.on{border-color:rgba(72,209,138,.35);background:var(--good-dim)}
.check.on .box{background:var(--good);border-color:var(--good);color:#06301b}
.check.on .box svg{opacity:1;transform:scale(1)}
.check .t{flex:1;font-weight:600;font-size:13px;line-height:1.25;min-width:0}
.check .t small{display:block;color:var(--muted);font-weight:500;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack.rapat{gap:6px}
.check .mono{color:var(--muted);font-size:12.5px}

/* prayer strip */
.sholat{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sholat .p{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative;transition:all .15s}
.sholat .p .n{font-weight:700;font-size:13px}
.sholat .p .w{font-family:var(--mono);font-size:19px;letter-spacing:-.02em;color:var(--text)}
.sholat .p .s{font-size:11px;color:var(--dim)}
.sholat .p.next{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
.sholat .p.next .s{color:var(--gold-2)}
.sholat .p.on{background:var(--good-dim);border-color:rgba(72,209,138,.4)}
.sholat .p.on .w{color:var(--good)}
.sholat .p .tick{position:absolute;right:10px;top:10px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center}
.sholat .p.on .tick{background:var(--good);border-color:var(--good);color:#06301b}
.sholat .p .tick svg{width:11px;height:11px}

.sholat .p.past{opacity:.55}
.sholat .p{cursor:default}
/* pertanyaan sholat */
.ask{margin-top:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,var(--gold-dim),transparent 60%),var(--bg-2);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ask.lengkap{background:linear-gradient(135deg,var(--good-dim),transparent 60%),var(--bg-2);border-color:rgba(72,209,138,.35)}
.ask.bolos{background:linear-gradient(135deg,var(--bad-dim),transparent 60%),var(--bg-2);border-color:rgba(239,93,111,.35)}
.ask .q{display:flex;flex-direction:column;gap:2px;flex:1;min-width:200px}
.ask .q b{font-family:var(--serif);font-size:20px;font-weight:400}
.ask .opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--panel-2);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;transition:all .15s}
.opt svg{width:15px;height:15px}
.opt.good.on{background:var(--good);border-color:var(--good);color:#06301b;box-shadow:0 0 0 4px var(--good-dim)}
.opt.bad.on{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 0 0 4px var(--bad-dim)}
.opt:hover:not(.on){color:var(--text);border-color:var(--gold)}
/* agenda (daftar kegiatan satu hari) */
.agenda{display:flex;flex-direction:column;gap:2px}
.ag{display:grid;grid-template-columns:44px 3px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:9px}
.ag .t{font-size:12px;color:var(--muted)}
.ag .bar{align-self:stretch;min-height:22px;background:var(--c);border-radius:3px}
.ag .x b{display:block;font-size:13px;font-weight:600}
.ag .x small{display:block;color:var(--muted);font-size:11.5px}
.ag .st{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ag.lewat{opacity:.5}
.ag.kini{background:var(--gold-dim);box-shadow:inset 0 0 0 1px rgba(227,178,90,.35)}
.ag[data-act]{cursor:pointer}.ag[data-act]:hover{background:var(--panel-2)}
/* jadwal seminggu */
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(138px,1fr));gap:8px;min-width:1000px}
.wday{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px}
.wday.today{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
.wday .dn{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 2px 6px}
.wday.today .dn{color:var(--gold-2)}
.wb{position:relative;border-left:3px solid var(--c);background:var(--panel-2);border-radius:7px;padding:5px 20px 5px 7px;font-size:11.5px;display:flex;flex-direction:column;gap:1px}
.wb .mono{font-size:10.5px;color:var(--muted)}
.wb b{font-weight:600;line-height:1.3}
.wb.sholat{background:transparent;padding-top:3px;padding-bottom:3px}
.wb.sholat b{font-weight:500;color:var(--muted)}
.wb.ok::after{content:"✓";position:absolute;right:7px;top:5px;color:var(--good);font-weight:800}
.wb.miss{box-shadow:inset 0 0 0 1px rgba(239,93,111,.55)}
.wb.clash{background:var(--bad-dim)}
.wb .flag{font-size:10px;color:var(--teal)}.wb .flag.bad{color:var(--bad)}
.wb[data-act]{cursor:pointer}.wb[data-act]:hover{background:var(--panel-3)}
.chips{display:flex;gap:3px}
.chips span{font-size:10.5px;font-weight:700;width:24px;text-align:center;padding:2px 0;border-radius:5px;background:var(--panel-3);color:var(--dim)}
.chips span.on{background:var(--good-dim);color:var(--good)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{cursor:pointer}
.daypick input{position:absolute;opacity:0;pointer-events:none}
.daypick span{display:inline-block;padding:7px 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--muted);font-weight:700;font-size:12.5px}
.daypick input:checked + span{background:var(--gold-dim);border-color:var(--gold);color:var(--gold-2)}
.daypick input:focus-visible + span{outline:2px solid var(--gold);outline-offset:2px}
/* input cepat transaksi */
.quick{display:grid;grid-template-columns:150px minmax(0,1fr) 150px 140px auto;gap:8px;align-items:center}
.quick.compact{grid-template-columns:minmax(0,1fr) 130px;margin-top:12px}
.quick input[name=jumlah]{font-family:var(--mono);text-align:right}
/* hutang per minggu */
.weeks{display:flex;flex-direction:column;gap:10px}
.wk{display:grid;grid-template-columns:140px minmax(0,1fr) 80px 120px;gap:12px;align-items:center;font-size:12.5px}
.wk.now .lbl{color:var(--gold-2);font-weight:700}
.wk .tr{height:12px;background:var(--panel-3);border-radius:99px;position:relative}
.wk .tr b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--good))}
.wk .tr i{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--gold);border-radius:2px}
.wk .v{text-align:right;color:var(--muted)}
.wk .pill{justify-self:start}
/* kartu fokus */
.fk{display:flex;flex-direction:column;gap:6px}
.fk h3{font-size:26px;font-weight:400;margin:2px 0 4px}
.fk .big{font-size:34px;font-weight:600;line-height:1;letter-spacing:-.02em}
.fk .lbl{font-size:12px;color:var(--muted)}
.fk .kv{margin-top:6px}
.fk .kv input{background:var(--bg-2)}
/* kalender sholat */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{aspect-ratio:1;border-radius:10px;background:var(--panel-3);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .1s}
.cal-cell:hover:not(.blank):not(.future){transform:scale(1.05);border-color:var(--gold)}
.cal-cell .d{font-family:var(--mono);font-weight:600;font-size:14px}
.cal-cell .m{font-size:10px;color:var(--dim);font-weight:700}
.cal-cell.blank{background:transparent;cursor:default}
.cal-cell.future{opacity:.3;cursor:default}
.cal-cell.lengkap{background:var(--good);color:#06301b}.cal-cell.lengkap .m{color:#06301b}
.cal-cell.bolos{background:var(--bad);color:#fff}.cal-cell.bolos .m{color:#fff}
.cal-cell.today{box-shadow:0 0 0 2px var(--gold)}
/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--panel-3);display:block}
.heat i.l1{background:rgba(72,209,138,.35)}.heat i.l2{background:rgba(72,209,138,.65)}.heat i.l3{background:var(--good)}
.heat i.v{background:var(--bad)}
.heat i.today{outline:1.5px solid var(--gold);outline-offset:1px}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.item .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.item .hd b{font-size:14.5px}
.item p{margin:0;color:var(--muted);font-size:13px;white-space:pre-wrap}
.item .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim)}
.prog{height:6px;background:var(--panel-3);border-radius:99px;overflow:hidden}
.prog b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--good));border-radius:99px}
.prog.gold b{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--line-2);border-radius:12px;font-size:13px}

/* week grid */
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.day{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:140px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}
.day .dn{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.day.today .dn{color:var(--teal)}
.cls{background:var(--panel-2);border-left:3px solid var(--teal);border-radius:8px;padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:2px;position:relative}
.cls b{font-size:13px}
.cls .mono{color:var(--muted);font-size:11.5px}
.cls .x{position:absolute;right:6px;top:6px;opacity:0;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
.cls:hover .x{opacity:1}

/* timeline */
.tl{display:grid;grid-template-columns:150px 1fr;gap:0}
.tl .ph{padding:14px 14px 14px 0;border-right:2px solid var(--line);position:relative}
.tl .ph::after{content:"";position:absolute;right:-6px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--gold-dim)}
.tl .ph.past::after{background:var(--good)}
.tl .ph.future::after{background:var(--panel-3);box-shadow:none;border:2px solid var(--line-2)}
.tl .ph b{display:block;font-family:var(--serif);font-size:20px;font-weight:400;color:var(--gold-2)}
.tl .ph span{font-size:12px;color:var(--muted)}
.tl .cards{padding:12px 0 12px 20px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));border-bottom:1px solid var(--line)}
.tl .ph{border-bottom:1px solid var(--line)}
.goal{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.goal.done{opacity:.65}
.goal .t{font-weight:700;font-size:13.5px}
.goal input[type=range]{width:100%;accent-color:var(--gold)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .grid line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .nilai{font-size:9.5px;fill:var(--text);font-weight:600}
.chart .bulan-kini{fill:var(--gold-2);font-weight:700}
.donut{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.donut svg{width:150px;height:150px}
.donut .tengah{font-family:var(--mono);font-size:15px;font-weight:600;fill:var(--text)}
.donut .tengah2{font-size:9.5px;fill:var(--muted)}
.donut .ket{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.donut .ket div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.donut .ket i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut .ket b{font-family:var(--mono);font-weight:600}
@media (max-width:560px){.donut{grid-template-columns:1fr;justify-items:center}.donut .ket{width:100%}}
/* busur matahari + siluet masjid di kepala langit */
.langit .busur{display:block;width:100%;height:auto;margin-top:8px}
.langit .masjid{display:block;width:min(100%,520px);height:auto;margin:-4px auto -2px;opacity:.45}
.langit .strip li{position:relative}
.langit .strip .ik{display:block;width:16px;height:16px;margin:0 auto 2px;opacity:.85}
.langit .strip .ik svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.langit .strip .sisa{display:block;font-size:10px;opacity:.85;margin-top:1px}
.langit .strip .maju{position:absolute;left:8px;right:8px;bottom:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.langit .strip .maju b{display:block;height:100%;background:#F5D28A;border-radius:2px}

  const noon = 12 + tz - lng/15 - EqT;
  const la = lat*rad;
  const cosT = ang => (-Math.sin(ang*rad) - Math.sin(la)*Math.sin(decl)) / (Math.cos(la)*Math.cos(decl));
  const T = ang => Math.acos(Math.max(-1,Math.min(1,cosT(ang))))/rad/15;
  const asr = () => { const t = (met.asr||1) + Math.tan(Math.abs(la - decl)); const ang = Math.atan(1/t); const c = (Math.sin(ang) - Math.sin(la)*Math.sin(decl)) / (Math.cos(la)*Math.cos(decl)); return Math.acos(Math.max(-1,Math.min(1,c)))/rad/15; };
  const toMin = h => Math.round(((h % 24)+24)%24 * 60);
  const terbit = noon - T(0.833), maghrib = noon + T(0.833), malam = 24 - (maghrib - terbit);   // panjang malam (jam)
  let subuh = noon - T(met.subuh), isya = met.isyaMenit ? maghrib + met.isyaMenit/60 : noon + T(met.isya);
  if (Math.abs(cosT(met.subuh)) > 1) subuh = terbit - malam/7;                          // lintang tinggi (musim panas Eropa): aturan sepertujuh malam
  if (!met.isyaMenit && Math.abs(cosT(met.isya)) > 1) isya = maghrib + malam/7;
  return {
    subuh: toMin(subuh) + 2, terbit: toMin(terbit) - 2, dzuhur: toMin(noon) + 2,
    ashar: toMin(noon + asr()) + 2, maghrib: toMin(maghrib) + 2, isya: toMin(isya) + 2
  };
}

async function sambungkanJadwal(){

    if (x.link || !['kebiasaan','ibadah'].includes(x.jenis)) return;
    const j = rapi(x.judul); if (!j) return;
    const a = aturan.find(a => { const r = rapi(a.nama); return r && (r===j || r.includes(j) || j.includes(r)); });
    if (a) { x.link = a.id; ubah++; }

  if (ubah && !tamu) await store.set('jadwal/rutinitas', S.jadwal);

const hari = k => S.harian[k] || { sholat:{}, kebiasaan:{}, pelanggaran:[], jurnal:{} };

/* ---------- logika disiplin & streak ---------- */
const aturanHarian = () => S.pengaturan.aturan.filter(a => a.jenis==='harian');
const aturanLarangan = () => S.pengaturan.aturan.filter(a => a.jenis==='larangan');
function statusSholat(k){ const s = hari(k).sholat; if (!s) return ''; if (s.status) return s.status; return SHOLAT.every(([id]) => s[id]) ? 'lengkap' : ''; } // data lama (centang per waktu) tetap terbaca
function skorHari(k){
  const h = hari(k);
  const sholat = statusSholat(k); const shOk = sholat==='lengkap';
  const hb = aturanHarian().filter(a => h.kebiasaan && h.kebiasaan[a.id]).length;
  const total = 1 + aturanHarian().length, done = (shOk?1:0) + hb;
  const langgar = (h.pelanggaran||[]).length > 0;
  return { sholat, shOk, hb, done, total, langgar, lengkap: done===total && !langgar };
}
function hitungStreak(){
  const today = todayKey();
  // streak disiplin: hari lengkap berturut-turut, berakhir hari ini (bila lengkap) atau kemarin
  let k = skorHari(today).lengkap ? today : addDays(today,-1), streak = 0;
  while (S.harian[k] && skorHari(k).lengkap) { streak++; k = addDays(k,-1); if (streak>2000) break; }
  // hari bersih: sejak pelanggaran terakhir
  const keys = Object.keys(S.harian).sort();
  let lastV = null; keys.forEach(kk => { if ((S.harian[kk].pelanggaran||[]).length) lastV = kk; });
  const first = keys[0] || today;
  const bersih = lastV ? Math.max(0, Math.round((parseKey(today)-parseKey(lastV))/864e5)) : Math.round((parseKey(today)-parseKey(first))/864e5) + 1;
  // rekor
  let rekor = 0, run = 0; if (keys.length) { let c = keys[0]; const end = today; while (c <= end) { if (S.harian[c] && skorHari(c).lengkap) { run++; rekor = Math.max(rekor, run); } else run = 0; c = addDays(c,1); } }
  // sholat: hari lengkap dalam 30 hari terakhir + streak sholat lengkap berturut-turut
  let sTot = 0; for (let i=0;i<30;i++) if (statusSholat(addDays(today,-i))==='lengkap') sTot++;
  let ks = statusSholat(today)==='lengkap' ? today : addDays(today,-1), streakSholat = 0;
  while (statusSholat(ks)==='lengkap') { streakSholat++; ks = addDays(ks,-1); if (streakSholat>2000) break; }
  const totalLanggar = keys.reduce((n,kk) => n + (S.harian[kk].pelanggaran||[]).length, 0);
  return { streak, bersih, rekor, lastV, sholat30: pct(sTot, 30), streakSholat, totalLanggar };
}

/* ---------- keuangan ---------- */
function ringkasBulan(mk){
  const tx = (S.aruskas.transaksi||[]).filter(t => t.tanggal && t.tanggal.startsWith(mk));
  if (tx.length) {
    const r = { pemasukan:0, pengeluaran:0, tabungan:0, kewajiban:0, kebutuhan:0, keinginan:0, hutang:0, rutin:0, nonFF:0, kuliah:0 };
    const luarFF = new Set((S.aruskas.rutin||[]).filter(x => x.ff===false).map(x => x.id)); // rutin sementara (mis. kuliah) yang tidak ikut target FF
    tx.forEach(t => { if (t.kategori==='Pemasukan') r.pemasukan += +t.masuk||0; else { const v = +t.keluar||0; if (t.kategori==='Tabungan') r.tabungan += v; else { r.pengeluaran += v; if (t.hutang) r.hutang += v; if (t.rutin) r.rutin += v; if (t.rutin && luarFF.has(t.rutin)) r.nonFF += v; if (t.kategori==='Kuliah' || t.rutin==='kuliah') r.kuliah += v; if (t.kategori==='Kebutuhan') r.kebutuhan+=v; else if (t.kategori==='Keinginan') r.keinginan+=v; else r.kewajiban+=v; } } });
    return { ...r, sumber:'transaksi', n: tx.length };
  }
  const m = (S.aruskas.bulan||{})[mk]; if (m) return { pemasukan:+m.pemasukan||0, pengeluaran:+m.pengeluaran||0, tabungan:+m.tabungan||0, hutang:0, rutin:0, sumber:'ringkasan', n:0 };
  return { pemasukan:0, pengeluaran:0, tabungan:0, hutang:0, rutin:0, sumber:'kosong', n:0 };
}
const totalAset = () => (S.aset.aset||[]).reduce((n,a) => n + (+a.nilai||0), 0);
const totalUtang = () => (S.aset.utang||[]).reduce((n,a) => n + (+a.nilai||0), 0);
/* fokus: angka turunan untuk kartu utama */
function pengeluaranRata(){ // rata-rata 3 bulan penuh terakhir yang punya data
  if (+S.fokus.pengeluaranBulanan > 0) return { nilai:+S.fokus.pengeluaranBulanan, sumber:'manual' };
  const vals = []; const d = new Date(); d.setDate(1);
  for (let i=1;i<=6 && vals.length<3;i++){ const m = new Date(d.getFullYear(), d.getMonth()-i, 1); const r = ringkasBulan(monthKey(m)); if (r.sumber!=='kosong' && r.pengeluaran>0) vals.push(r.pengeluaran - (r.hutang||0) - (r.nonFF||0) - (r.kuliah||0)); } // cicilan hutang & kuliah dipisah; kuliah ditambahkan lagi di infoFF sebagai angka patokan
  return { nilai: vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0, sumber: vals.length ? `rata-rata ${vals.length} bulan penuh terakhir, tanpa kuliah & cicilan hutang` : 'belum ada data' };
}
function infoHutang(){
  const sisa = totalUtang(), puncak = +S.fokus.puncakUtang||sisa, cicilan = +S.fokus.cicilanMingguan||0;
  const minggu = cicilan ? Math.ceil(sisa/cicilan) : 0; const lunas = new Date(); lunas.setDate(lunas.getDate() + minggu*7);
  // rata-rata bayar per minggu: maksimal 4 minggu terakhir, dihitung sejak pembayaran pertama yang tercatat
  const bayar = txHutang(); let rata4 = 0, lunasRata = '';
  if (bayar.length) { const ws = awalMinggu(todayKey()); const first = awalMinggu(bayar.map(t=>t.tanggal).sort()[0]);
    const akhir = (bayarMinggu(ws) > 0 || first >= ws) ? ws : addDays(ws, -7); // minggu berjalan yang belum dibayar tidak ikut dirata-rata
    const n = Math.max(1, Math.min(4, Math.round((parseKey(akhir)-parseKey(first))/(7*864e5)) + 1)); const dari = addDays(akhir, -7*(n-1));
    rata4 = Math.round(bayar.filter(t=>t.tanggal>=dari && t.tanggal<=addDays(akhir,6)).reduce((s,t)=>s+(+t.keluar||0),0) / n);
    if (rata4>0) { const d = new Date(); d.setDate(d.getDate() + Math.ceil(sisa/rata4)*7); lunasRata = key(d); } }
  return { sisa, puncak, cicilan, minggu, lunas: key(lunas), terbayar: pct(puncak-sisa, puncak), rata4, lunasRata };
}
/* FF = (pengeluaran bulanan tanpa kuliah + biaya kuliah per bulan) × 12 × 25.
   Biaya kuliah memakai angka patokan per minggu (bawaan Rp300 rb) dikonversi ke bulanan: × 52 ÷ 12. */
function infoFF(){
  const p = pengeluaranRata(); const kuliahMinggu = S.fokus.kuliahMingguan ?? 300000; const kuliahBulan = Math.round((+kuliahMinggu||0) * 52 / 12);
  const bulanan = p.nilai + kuliahBulan; const target = bulanan*12*25; const kb = totalAset()-totalUtang();
  return { pengeluaran:p.nilai, kuliahMinggu:+kuliahMinggu||0, kuliahBulan, bulanan, sumber:p.sumber, target, kb, aset: totalAset(), progres: target ? Math.max(0, Math.min(100, Math.round(kb/target*100))) : 0, kurang: Math.max(0, target-kb) };
}

const tile = (lbl, big, sub='', cls='') => `<div class="tile ${cls}"><div class="lbl">${lbl}</div><div class="big">${big}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
function heatmap(weeks=16){
  const today = todayKey(); const start = parseKey(addDays(today, -(weeks*7-1))); start.setDate(start.getDate() - start.getDay());
  let html = '<div class="heat">'; let d = key(start);

  return html + '</div>';
}
function barChart(series, opts={}){ // series: [{label, values:{a,b,c}, kini}], opts.keys [[key,color]]
  const W = 600, H = 200, padL = 58, padB = 26, padT = 14, padR = 8; const keys = opts.keys;
  const max = Math.max(1, ...series.flatMap(s => keys.map(([k]) => +s.values[k]||0)));
  const step = Math.pow(10, Math.floor(Math.log10(max))); const nice = Math.ceil(max/step)*step;
  const gw = (W-padL-padR)/series.length, bw = Math.min(20, (gw-14)/keys.length), gap = 4;
  const uid = 'g' + Math.random().toString(36).slice(2,7);
  let defs = '<defs>' + keys.map(([k,c],j) => `<linearGradient id="${uid}${j}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".55"/></linearGradient>`).join('') + '</defs>';
  let g = '<g class="grid">'; for (let i=0;i<=4;i++){ const y = padT + (H-padT-padB)*(1-i/4); g += `<line x1="${padL}" x2="${W-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end">${rpS(nice*i/4).replace('Rp','')}</text>`; } g += '</g>';
  let bars = ''; series.forEach((s,i) => { const x0 = padL + gw*i + (gw - bw*keys.length - gap*(keys.length-1))/2;
    if (s.kini) bars += `<rect x="${(padL+gw*i+2).toFixed(1)}" y="${padT-6}" width="${(gw-4).toFixed(1)}" height="${H-padB-padT+6}" rx="8" fill="var(--gold)" opacity=".07"/>`;
    keys.forEach(([k,color],j) => { const v = +s.values[k]||0; const h = Math.max(v ? 3 : 1.5, (H-padT-padB)*v/nice); const x = x0+j*(bw+gap), y = H-padB-h;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${v?`url(#${uid}${j})`:'var(--line)'}"><title>${s.label} · ${k}: ${rp(v)}</title></rect>`;
      if (v && h > 16 && series.length <= 6) bars += `<text class="nilai" x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" opacity=".9">${rpS(v).replace('Rp','')}</text>`; });
    bars += `<text class="${s.kini?'bulan-kini':''}" x="${(padL+gw*i+gw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${s.label}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${defs}${g}${bars}</svg>`;
}
/* donat: komposisi (pengeluaran per kategori, aset per jenis) */
function donutChart(items, judul, sub){ // items: [{label, v, color}]
  const total = items.reduce((n,x) => n + (+x.v||0), 0); if (!total) return '<div class="empty">Belum ada data.</div>';
  const R = 60, r = 42, C = 75; let a0 = -Math.PI/2; const seg = items.filter(x => x.v>0).sort((a,b)=>b.v-a.v).map(x => { const a1 = a0 + 2*Math.PI*x.v/total; const big = a1-a0 > Math.PI ? 1 : 0;
    const p = (ang, rad) => `${(C+rad*Math.cos(ang)).toFixed(2)},${(C+rad*Math.sin(ang)).toFixed(2)}`;
    const d = `M${p(a0,R)} A${R},${R} 0 ${big} 1 ${p(a1,R)} L${p(a1,r)} A${r},${r} 0 ${big} 0 ${p(a0,r)} Z`; a0 = a1;
    return `<path d="${d}" fill="${x.color}" stroke="var(--panel)" stroke-width="2"><title>${x.label}: ${rp(x.v)} (${pct(x.v,total)}%)</title></path>`; }).join('');
  return `<div class="donut"><svg viewBox="0 0 150 150">${seg}<text class="tengah" x="75" y="72" text-anchor="middle">${judul}</text><text class="tengah2" x="75" y="88" text-anchor="middle">${sub}</text></svg>
    <div class="ket">${items.filter(x=>x.v>0).sort((a,b)=>b.v-a.v).map(x => `<div><i style="background:${x.color}"></i><span>${esc(x.label)}</span><b>${pct(x.v,total)}% · ${rpS(x.v)}</b></div>`).join('')}</div></div>`;
}
function lineChart(points){ // [{label, v}]
  const W = 600, H = 170, padL = 48, padB = 24, padT = 12, padR = 12; if (points.length<2) return '<div class="empty">Isi nilai aset minimal dua bulan untuk melihat grafik.</div>';
  const vals = points.map(p=>p.v); const lo = Math.min(0, ...vals), hi = Math.max(...vals)||1; const span = hi-lo || 1;
  const X = i => padL + (W-padL-padR)*i/(points.length-1), Y = v => padT + (H-padT-padB)*(1-(v-lo)/span);
  let g = '<g class="grid">'; for (let i=0;i<=3;i++){ const v = lo + span*i/3; g += `<line x1="${padL}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${padL-6}" y="${Y(v)+3}" text-anchor="end">${rpS(v).replace('Rp','')}</text>`; } g += '</g>';
  // kurva halus (Catmull-Rom → Bézier)
  const pts = points.map((p,i) => [X(i), Y(p.v)]); let path = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i=0;i<pts.length-1;i++){ const p0 = pts[i-1]||pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2]||p2;
    const c1 = [p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6], c2 = [p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6];
    path += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`; }
  const area = path + ` L${X(points.length-1)},${Y(lo)} L${X(0)},${Y(lo)} Z`;
  const akhir = points[points.length-1]; const labelAkhir = `<text class="nilai" x="${(X(points.length-1)-6).toFixed(1)}" y="${(Y(akhir.v)-10).toFixed(1)}" text-anchor="end">${rpS(akhir.v)}</text>`;
  const dots = points.map((p,i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="${i===points.length-1?4.5:3}" fill="${i===points.length-1?'var(--gold-2)':'var(--panel)'}" stroke="var(--gold)" stroke-width="2"><title>${p.label}: ${rp(p.v)}</title></circle><text x="${X(i)}" y="${H-6}" text-anchor="middle">${p.label}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".35"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labelAkhir}</svg>`;
}

function busurLangit(nm, wt){
  const X = t => 12 + (t/1440)*336, dasar = 50, tinggi = 38;
  const Y = t => (t > wt.terbit && t < wt.maghrib) ? dasar - Math.sin(Math.PI*(t-wt.terbit)/(wt.maghrib-wt.terbit))*tinggi : dasar;
  let jalur = ''; for (let t = wt.terbit; t <= wt.maghrib; t += 10) jalur += (jalur?'L':'M') + X(t).toFixed(1) + ' ' + Y(t).toFixed(1);
  const titik = SHOLAT.map(([k,nmk]) => `<circle cx="${X(wt[k]).toFixed(1)}" cy="${Y(wt[k]).toFixed(1)}" r="3" fill="#fff" fill-opacity="${nm > wt[k] ? .45 : .95}"><title>${nmk} ${jam(wt[k])}</title></circle>`).join('');
  const siang = nm >= wt.terbit && nm <= wt.maghrib; const cx = X(nm).toFixed(1), cy = Y(nm).toFixed(1);
  const penanda = siang ? `<circle cx="${cx}" cy="${cy}" r="13" fill="#FFE3A3" fill-opacity=".22"/><circle cx="${cx}" cy="${cy}" r="6.5" fill="#FFE7B0"/>`
    : `<circle cx="${cx}" cy="${cy}" r="6" fill="#EEF1FF"/><circle cx="${(+cx+3).toFixed(1)}" cy="${(+cy-2).toFixed(1)}" r="5" fill="#1A2350" fill-opacity=".85"/>`;
  return `<svg class="busur" viewBox="0 0 360 56" aria-label="Posisi matahari hari ini"><line x1="12" y1="${dasar}" x2="348" y2="${dasar}" stroke="#fff" stroke-opacity=".35" stroke-dasharray="2 4"/><path d="${jalur}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>${titik}${penanda}</svg>`;
}

  const sumber = [
    ['https://ipwho.is/', j => j && j.success !== false && j.latitude ? { lat:j.latitude, lng:j.longitude, kota:j.city, prov:j.region, negara:j.country, cc:j.country_code } : null],

    ['https://ipapi.co/json/', j => j && j.latitude ? { lat:j.latitude, lng:j.longitude, kota:j.city, prov:j.region, negara:j.country_name, cc:j.country_code } : null]
  ];
  for (const [url, ubah] of sumber) { try { const r = await fetch(url, { signal: AbortSignal.timeout(7000) }); const h = ubah(await r.json()); if (h) return h; } catch {} }

}

/* ----- Rencana 3 tahun ----- */
/* Periode planning selama 3 tahun dari mulai3Tahun. Mode: bulan (36), kuartal (12), tahun (3). */
const MODE_RENCANA = { bulan:['Per bulan',1], kuartal:['Per 3 bulan',3], tahun:['Per tahun',12] };
const modeRencana = () => MODE_RENCANA[S.pengaturan.modeRencana] ? S.pengaturan.modeRencana : 'kuartal';
function tahunRencana(){
  const m = parseKey(S.pengaturan.mulai3Tahun||'2026-09-01'); const out = [];
  const rentang = (a, b) => `${BLN[a.getMonth()]} ${a.getFullYear()} – ${BLN[b.getMonth()]} ${b.getFullYear()}`;
  for (let t = 0; t < 3; t++) {
    const a = new Date(m.getFullYear(), m.getMonth()+t*12, 1), b = new Date(m.getFullYear(), m.getMonth()+t*12+12, 0);
    const kuartal = [0,1,2,3].map(q => { const qa = new Date(m.getFullYear(), m.getMonth()+t*12+q*3, 1), qb = new Date(m.getFullYear(), m.getMonth()+t*12+q*3+3, 0);
      return { nama:`Kuartal ${q+1}`, sub: qa.getFullYear()===qb.getFullYear() ? `${BLN[qa.getMonth()]}–${BLN[qb.getMonth()]} ${qb.getFullYear()}` : rentang(qa, qb), mulai:key(qa), akhir:key(qb) }; });
    out.push({ i:t, nama:`Tahun ${t+1}`, sub:rentang(a, b), mulai:key(a), akhir:key(b), kuartal });
  }
  return out;
}
function faseRencana(){
  const m = parseKey(S.pengaturan.mulai3Tahun||'2026-09-01'); const mode = modeRencana(); const lebar = MODE_RENCANA[mode][1]; const out = [];
  for (let i=0; i*lebar<36; i++){ const a = new Date(m.getFullYear(), m.getMonth()+i*lebar, 1); const b = new Date(m.getFullYear(), m.getMonth()+i*lebar+lebar, 0);
    const nama = mode==='bulan' ? `${BULAN[a.getMonth()]} ${a.getFullYear()}` : mode==='kuartal' ? `Kuartal ${i+1}` : `Tahun ${i+1}`;
    const sub = mode==='bulan' ? `bulan ke-${i+1} dari 36` : `${BLN[a.getMonth()]} ${a.getFullYear()} – ${BLN[b.getMonth()]} ${b.getFullYear()}`;
    out.push({ i, mulai:key(a), akhir:key(b), nama, sub }); }
  return out;
}
function vRencana(){
  const items = S.rencana.items||[]; const tk = todayKey(); const tahun = tahunRencana(); const filter = S.tab.rencanaKat||'Semua';
  const shown = items.filter(x => filter==='Semua' || x.kategori===filter);
  const done = items.filter(x=>x.selesai).length; const avg = items.length ? Math.round(items.reduce((n,x)=>n+(x.selesai?100:+x.progres||0),0)/items.length) : 0;
  const mulai = parseKey(S.pengaturan.mulai3Tahun||'2026-09-01'); const lewat = Math.max(0, Math.min(100, Math.round((new Date()-mulai)/(3*365.25*864e5)*100)));
  const card = x => `<div class="goal ${x.selesai?'done':''}"><div class="row between"><span class="pill ${({Ibadah:'gold',Disiplin:'bad',Olahraga:'teal',Belajar:'violet',Finansial:'good',Bisnis:'warn'})[x.kategori]||''}">${esc(x.kategori)}</span><span class="row"><button class="btn sm ghost" data-act="rencana-edit" data-id="${x.id}">Ubah</button><button class="btn sm ghost" data-act="rencana-hapus" data-id="${x.id}">Hapus</button></span></div>
    <div class="t">${esc(x.judul)}</div>${x.catatan?`<div class="small muted">${esc(x.catatan)}</div>`:''}
    <div class="row between small"><span class="dim">Tenggat ${fmtTgl(x.target,false)} ${x.target.slice(0,4)}${x.target<tk&&!x.selesai?' <span class="pill bad">lewat</span>':''}</span><span class="mono">${x.selesai?'selesai':(x.progres||0)+'%'}</span></div>
    <input type="range" min="0" max="100" step="5" value="${x.selesai?100:x.progres||0}" data-act="rencana-progres" data-id="${x.id}" ${x.selesai?'disabled':''}>
    <div class="row between"><label class="row small muted" style="cursor:pointer"><input type="checkbox" data-act="rencana-selesai" data-id="${x.id}" ${x.selesai?'checked':''}> Tandai selesai</label></div></div>`;
  return `
  <div class="topbar"><div><div class="eyebrow">${fmtTgl(S.pengaturan.mulai3Tahun||'2026-09-01',false)} ${(S.pengaturan.mulai3Tahun||'2026').slice(0,4)} → 2029</div><h1 class="serif"><em>Planning</em></h1><div class="sub">Tiga tahun, tiap tahun empat kuartal. Taruh target di kuartal yang tepat supaya tiap tiga bulan ada yang bisa dicek. Kuartal berjalan diberi bingkai emas.</div></div>
    <div class="row"><select data-field="rencanaKat" style="width:auto"><option>Semua</option>${KATEGORI_RENCANA.map(k=>`<option ${filter===k?'selected':''}>${k}</option>`).join('')}</select><button class="btn primary" data-act="rencana-tambah">Tambah target</button></div></div>
  <div class="grid">
    <div class="c4">${tile('Waktu berjalan', lewat+'%', 'dari 3 tahun', 'gold')}</div>
    <div class="c4">${tile('Rata-rata progres', avg+'%', `${items.length} target`, 'teal')}</div>
    <div class="c4">${tile('Selesai', done, 'target tercapai', done?'good':'')}</div>
    ${tahun.map(t => { const nT = shown.filter(x => x.target>=t.mulai && x.target<=t.akhir).length; const cls = t.akhir<tk?'past':t.mulai>tk?'future':'kini';
      return `<div class="c12 panel"><h2><span>${t.nama} <span class="small muted" style="font-weight:500">${t.sub}</span></span><span class="pill ${cls==='kini'?'gold':''}">${cls==='kini'?'tahun berjalan · ':''}${nT} target</span></h2>
        <div class="kuartal-grid">${t.kuartal.map(q => { const list = shown.filter(x => x.target>=q.mulai && x.target<=q.akhir); const qc = q.akhir<tk?'past':q.mulai>tk?'future':'kini';
          return `<div class="kuartal ${qc}"><div class="kh"><b>${q.nama}</b><span>${q.sub}</span></div>${list.map(card).join('') || `<div class="dim small">Belum ada target.</div>`}</div>`; }).join('')}</div></div>`; }).join('')}
    ${(() => { const luar = shown.filter(x => x.target < tahun[0].mulai || x.target > tahun[2].akhir); return luar.length ? `<div class="c12 panel"><h2>Di luar rentang 3 tahun</h2><div class="kuartal-grid">${luar.map(card).join('')}</div></div>` : ''; })()}
  </div>`;
}

const JENIS = { sholat:'Sholat', kuliah:'Kuliah', ibadah:'Ibadah', kebiasaan:'Kebiasaan', keuangan:'Keuangan', agenda:'Agenda' };
const WARNA = { sholat:'var(--gold)', ibadah:'var(--gold-2)', kuliah:'var(--teal)', kebiasaan:'var(--good)', keuangan:'var(--violet)', agenda:'var(--muted)' };
const keMenit = t => { const [h,m] = String(t||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); };
const menitSekarang = () => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); };
const pilihanTautan = () => [['', 'Tidak ditautkan'], ...aturanHarian().map(a => [a.id, 'Kebiasaan: ' + a.nama]), ['jurnal','Isi jurnal'], ['catat','Catat pengeluaran'], ['hutang','Bayar hutang minggu ini']];
function pergi(view){ if (S.view===view) render(); else location.hash = '#' + view; }
const awalPakai = () => Object.keys(S.harian).sort()[0] || todayKey(); // hari sebelum dasbor dipakai tidak dihitung terlewat

/* semua kegiatan satu tanggal: sholat (dihitung), kuliah, rutinitas, dan DCA; lalu tandai bentrok */
function blokHari(k){
  const d = parseKey(k), dow = d.getDay(), out = [];
  const wt = waktuSholat(d, S.pengaturan.lat, S.pengaturan.lng);
  SHOLAT.forEach(([id,n]) => out.push({ id:'sholat-'+id, judul:n, jenis:'sholat', mulai:jam(wt[id]), selesai:jam(wt[id]+15), link:'sholat:'+id }));
  (S.kuliah.items||[]).filter(c => c.hari===dow).forEach(c => out.push({ id:'kuliah-'+c.id, judul:c.mk, jenis:'kuliah', mulai:c.mulai, selesai:c.selesai, ket:c.ruang||'' }));
  (S.jadwal.agenda||[]).filter(a => a.tanggal===k && a.mulai).forEach(a => out.push({ id:'agenda-'+a.id, judul:a.judul, jenis:'agenda', mulai:a.mulai, selesai:a.selesai||a.mulai, ket:a.ket||'', link:'agenda:'+a.id }));
  const kuliahHariIni = (S.kuliah.items||[]).filter(c => c.hari===dow).map(c => [keMenit(c.mulai), keMenit(c.selesai)]);
  // Jam yang sudah terpakai hari itu: kuliah, agenda bertanggal, dan tiap kegiatan
  // rutin yang sudah selesai ditempatkan. Sholat sengaja tidak dihitung karena cuma
  // 15 menit dan memang boleh bersisian dengan kegiatan lain.
  const terisi = kuliahHariIni.slice();
  out.filter(o => o.jenis==='agenda').forEach(o => terisi.push([keMenit(o.mulai), keMenit(o.selesai||o.mulai)]));
  // Taruh di celah kosong pertama pada atau sesudah jam yang diinginkan. Dulu
  // kegiatan hanya menghindari jam kuliah, tidak saling menghindari, sehingga dua
  // kegiatan yang sama-sama terdorong oleh kuliah bisa mendarat di jam yang sama.
  // Kalau sampai lewat jam 23.00, dibiarkan di tempat semula supaya ditandai
  // bentrok, bukan didorong ke tengah malam.
  const taruh = (m0, lama) => {
    let geser = false;
    for (let putar = 0; putar < 12; putar++) {
      const tabrak = terisi.find(([a, b]) => m0 < b && a < m0 + lama);
      if (!tabrak) break;
      if (tabrak[1] + lama > 23 * 60) return { m0, geser };
      m0 = tabrak[1]; geser = true;
    }
    terisi.push([m0, m0 + lama]);
    return { m0, geser };
  };
  // Urutan penempatan menentukan siapa yang mengalah. Ibadah ditaruh lebih dulu,
  // supaya dzikir sore tidak terdorong sampai mepet Maghrib gara-gara blok belajar
  // kebetulan disebut lebih awal di daftar. Sesudah itu urut jam yang diinginkan.
  const URUT = { ibadah:0, kebiasaan:1, keuangan:2 };
  (S.jadwal.items||[]).filter(x => (x.hari||[]).includes(dow)).map(x => {
    const berpegang = x.setelah && wt[x.setelah] !== undefined;
    return { x, berpegang,
      lama: berpegang ? (+x.durasi || 15) : (x.selesai && x.mulai ? Math.max(15, keMenit(x.selesai) - keMenit(x.mulai)) : 15),
      awalnya: berpegang ? wt[x.setelah] + 15 + (+x.jeda || 0) : (x.mulai ? keMenit(x.mulai) : null) };
  }).sort((a, b) => (URUT[a.x.jenis] ?? 3) - (URUT[b.x.jenis] ?? 3) || (a.awalnya ?? 1e9) - (b.awalnya ?? 1e9))
    .forEach(({ x, lama, awalnya }) => {
      if (awalnya === null) { out.push({ ...x }); return; }
      const hasil = taruh(awalnya, lama);
      out.push({ ...x, mulai: jam(hasil.m0), selesai: jam(hasil.m0 + lama),
        ket: hasil.geser ? 'Digeser: jamnya sudah terpakai' + (x.ket ? ' · ' + x.ket : '') : x.ket });
    });
  (S.aset.aset||[]).filter(a => a.dca && a.dca.aktif && +a.dca.jumlah>0).forEach(a => { const p = a.dca;
    const cocok = p.frek==='bulanan' ? d.getDate() === Math.min(+p.tanggal||1, 28) : dow === +p.hari;
    if (cocok) out.push({ id:'dca-'+a.id, judul:`DCA ${a.nama} ${rpS(p.jumlah)}`, jenis:'keuangan', mulai:p.jam||'10:15', selesai:jam(keMenit(p.jam||'10:15')+15), link:'dca:'+a.id, ket:p.frek==='bulanan'?'setoran bulanan':'setoran mingguan' }); });
  out.forEach(b => { b.m0 = keMenit(b.mulai); b.m1 = keMenit(b.selesai||b.mulai); if (b.m1 <= b.m0) b.m1 = b.m0 + 15; });
  out.sort((a,b) => a.m0 - b.m0 || (a.jenis==='sholat' ? -1 : 1));
  out.forEach(b => {
    if (b.jenis==='sholat') { b.sela = out.some(o => o.jenis==='kuliah' && b.m0 >= o.m0 && b.m0 < o.m1); return; }
    b.bentrok = out.some(o => o!==b && o.jenis!=='sholat' && o.m0 < b.m1 && b.m0 < o.m1);
  });
  return out;
}
/* true = selesai, false = belum, null = tidak bisa dicek otomatis */
function selesaiBlok(b, k){
  const l = b.link; if (!l) return null; const h = hari(k);
  if (l.startsWith('sholat')) { const id = l.split(':')[1]; const sh = h.sholat||{}; if (sh[id]) return true; if (sh.status==='lengkap') return true; if (sh.status==='bolos') return false; return null; }
  if (l==='jurnal') return !!(h.jurnal && (h.jurnal.refleksi || h.jurnal.syukur || h.jurnal.pelajaran || h.jurnal.besok));
  if (l==='catat') return (S.aruskas.transaksi||[]).some(t => t.tanggal===k && !t.rutin);
  if (l==='hutang') { const t = +S.fokus.cicilanMingguan||0, p = bayarMinggu(awalMinggu(k)); return t ? p >= t : p > 0; }
  if (l.startsWith('dca:')) { const a = (S.aset.aset||[]).find(x => x.id===l.slice(4)); const s = a ? statusDCA(a, k) : null; return s ? s.ok : null; }
  return !!(h.kebiasaan && h.kebiasaan[l]);
}
async function klikBlok(link, k){
  if (link && link.startsWith('agenda:')) return modalAgenda(clone((S.jadwal.agenda||[]).find(a => a.id===link.slice(7))));
  if (!link) return;
  if (link.startsWith('sholat')) { const id = link.split(':')[1]; if (!id) return pergi('sholat');
    if (k > todayKey()) { toast('Belum waktunya. Centang setelah sholat.', true); return; }
    const h = hari(k); h.sholat = h.sholat||{};
    if (h.sholat.status==='lengkap') { SHOLAT.forEach(([x]) => h.sholat[x] = true); delete h.sholat.status; }   // ubah "lengkap" jadi centang per waktu supaya bisa dibatalkan satu-satu
    h.sholat[id] = !h.sholat[id]; if (h.sholat.status==='bolos' && SHOLAT.every(([x]) => h.sholat[x])) delete h.sholat.status;
    await simpanHari(k, h); const n = SHOLAT.filter(([x]) => h.sholat[x]).length; const nama = (SHOLAT.find(([x]) => x===id)||[])[1];
    toast(h.sholat[id] ? (n===5 ? 'Alhamdulillah, lima waktu lengkap hari ini' : `${nama} tercentang · ${n} dari 5`) : `Centang ${nama} dibatalkan`); render(); return; }
  if (link==='jurnal') { S.jurnalTgl = k > todayKey() ? todayKey() : k; return pergi('jurnal'); }
  if (link==='catat') { S.tab.keuangan = 'arus'; return pergi('keuangan'); }
  if (link==='hutang') { S.tab.keuangan = 'hutang'; return pergi('keuangan'); }
  if (link.startsWith('dca:')) return modalSetor(link.slice(4));
  if (k > todayKey()) { toast('Belum harinya. Centang saat sudah dikerjakan.', true); return; }
  const h = hari(k); h.kebiasaan = h.kebiasaan||{}; h.kebiasaan[link] = !h.kebiasaan[link]; await simpanHari(k, h);
  toast(h.kebiasaan[link] ? 'Selesai, tercentang' : 'Centang dibatalkan'); render();
}
function tandaBlok(b, k, lewat){
  const s = selesaiBlok(b, k); const f = [];
  if (s===true) f.push('<span class="pill good">selesai</span>');
  else if (s===false && b.jenis==='sholat') f.push('<span class="pill bad">bolos</span>');
  else if (s===false && lewat) f.push('<span class="pill warn">belum</span>');
  if (b.sela) f.push('<span class="pill teal" title="Waktu sholat jatuh di jam kuliah">di sela kuliah</span>');
  if (b.bentrok) f.push('<span class="pill bad" title="Jamnya bertabrakan dengan kegiatan lain">bentrok</span>');
  return f.join('');
}
function agendaHari(k, ringkas){
  const nm = menitSekarang(), tk = todayKey(); let bl = blokHari(k);
  const iNext = k===tk ? bl.findIndex(b => b.m0 > nm) : -1;
  let kepala = '';
  if (ringkas && k===tk) {   // Beranda: yang sudah lewat dilipat jadi satu baris, sisanya dari yang sedang berjalan
    const lewat = bl.filter(b => b.m1 <= nm), sisa = bl.filter(b => b.m1 > nm);
    if (lewat.length) { const beres = lewat.filter(b => selesaiBlok(b, k)===true).length, luput = lewat.filter(b => selesaiBlok(b, k)===false && b.jenis!=='sholat').length;
      kepala = `<div class="small dim" style="padding:2px 8px 6px">${lewat.length} kegiatan sudah lewat · ${beres} selesai${luput?` · <span style="color:var(--warn)">${luput} terlewat</span>`:''} · <a href="#jadwal" style="color:var(--gold-2)">lihat semua</a></div>`; }
    bl = sisa.length ? sisa : bl.slice(-3);
  }
  return kepala + `<div class="agenda">${bl.map((b,i) => { const lewat = k<tk || (k===tk && b.m1 <= nm), kini = k===tk && b.m0 <= nm && nm < b.m1;
    return `<div class="ag ${lewat&&!kini?'lewat':''} ${kini?'kini':''} ${ringkas?'ringkas':''}" style="--c:${WARNA[b.jenis]||'var(--muted)'}" ${b.link?`data-act="blok" data-link="${esc(b.link)}" data-tgl="${k}" title="Ketuk untuk menandai / membuka"`:''}>
      <span class="t mono">${b.mulai}</span><span class="bar"></span><span class="x"><b>${b.jenis==='sholat'?'Sholat ':b.jenis==='kuliah'?'Kuliah · ':''}${esc(b.judul)}</b>${b.ket?`<small>${esc(b.ket)}</small>`:''}</span>
      <span class="st">${kini?'<span class="pill gold">sekarang</span>':''}${i===iNext?'<span class="pill">berikutnya</span>':''}${tandaBlok(b, k, lewat)}</span></div>`; }).join('')}</div>`;
}
function vJadwal(){
  const tab = S.tab.jadwal||'minggu'; const tk = todayKey(), nm = menitSekarang();
  const ws = addDays(awalMinggu(tk), (S.jadwalOff||0)*7); const days = [0,1,2,3,4,5,6].map(i => addDays(ws, i));
  let wajib = 0, beres = 0, bentrok = 0; const mulaiPakai = awalPakai();
  days.forEach(k => blokHari(k).forEach(b => { if (b.bentrok) bentrok++; if (b.jenis==='sholat' || k < mulaiPakai) return; const s = selesaiBlok(b, k); if (s===null) return;
    if (k < tk || (k===tk && b.m1 <= nm)) { wajib++; if (s) beres++; } }));
  const sks = (S.kuliah.items||[]).reduce((n,c) => n + (keMenit(c.selesai)-keMenit(c.mulai)), 0);
  const kepatuhan = wajib ? pct(beres, wajib) : 0;
  const tabs = `<div class="tabs"><button class="${tab==='minggu'?'on':''}" data-act="tab" data-k="jadwal" data-v="minggu">Seminggu</button><button class="${tab==='hari'?'on':''}" data-act="tab" data-k="jadwal" data-v="hari">Hari ini</button><button class="${tab==='kalender'?'on':''}" data-act="tab" data-k="jadwal" data-v="kalender">Kalender</button><button class="${tab==='atur'?'on':''}" data-act="tab" data-k="jadwal" data-v="atur">Atur rutinitas</button></div>`;

  let isi = '';

    isi = `<div class="c12 panel"><h2><span>Minggu ${labelMinggu(ws)} ${ws===awalMinggu(tk)?'<span class="pill gold">minggu ini</span>':''}</span><span class="row"><button class="btn sm" data-act="jadwal-geser" data-v="-1" aria-label="Minggu sebelumnya">‹</button><button class="btn sm" data-act="jadwal-geser" data-v="0">Minggu ini</button><button class="btn sm" data-act="jadwal-geser" data-v="1" aria-label="Minggu berikutnya">›</button></span></h2>
      <div class="scroll"><div class="wgrid">${days.map(k => { const d = parseKey(k); const lewatHari = k < tk;
        return `<div class="wday ${k===tk?'today':''}"><div class="dn"><span>${HARI[d.getDay()]}</span><span>${d.getDate()} ${BLN[d.getMonth()]}</span></div>${blokHari(k).map(b => { const s = selesaiBlok(b, k); const lewat = lewatHari || (k===tk && b.m1 <= nm);
          return `<div class="wb ${b.jenis} ${s===true?'ok':''} ${s===false&&lewat&&b.jenis!=='sholat'&&k>=mulaiPakai?'miss':''} ${b.bentrok?'clash':''}" style="--c:${WARNA[b.jenis]||'var(--muted)'}" ${b.link?`data-act="blok" data-link="${esc(b.link)}" data-tgl="${k}"`:''} title="${esc(b.judul)}${b.ket?' · '+esc(b.ket):''}"><span class="mono">${b.mulai}${b.jenis!=='sholat'&&b.selesai?'–'+b.selesai:''}</span><b>${b.jenis==='sholat'?'Sholat ':''}${esc(b.judul)}</b>${b.sela?'<span class="flag">di sela kuliah</span>':''}${b.bentrok?'<span class="flag bad">bentrok</span>':''}</div>`; }).join('')}</div>`; }).join('')}</div></div>
      ${legend}<div class="small dim" style="margin-top:8px">Ketuk kegiatan bertanda kebiasaan untuk mencentang, atau kegiatan keuangan untuk membuka formulirnya. ✓ = sudah dikerjakan, garis merah = terlewat.</div></div>`;
  } else if (tab==='hari') {
    const k = tk; isi = `<div class="c8 panel"><h2>${fmtTgl(k)}</h2>${barisTenggat(k)}${agendaHari(k)}${legend}</div>
      <div class="c4 panel"><h2>Cara pakai</h2><div class="stack small muted"><span>Kegiatan yang sedang berjalan diberi warna emas, dan berikutnya ditandai.</span><span>Ketuk kebiasaan untuk mencentang. Ketuk kegiatan keuangan atau jurnal untuk langsung membuka formulirnya.</span><span>Sholat dan kuliah masuk otomatis dari halaman masing-masing.</span></div></div>`;
  } else if (tab==='kalender') {
    isi = kalender();
  } else {
    const wtHariIni = waktuSholat(new Date(), S.pengaturan.lat, S.pengaturan.lng);
    const menitItem = x => x.setelah && wtHariIni[x.setelah]!==undefined ? wtHariIni[x.setelah] + 15 + (+x.jeda||0) : keMenit(x.mulai);
    const jamItem = x => x.setelah ? `setelah ${(SHOLAT.find(s => s[0]===x.setelah)||[,x.setelah])[1]}${+x.jeda?` +${x.jeda}m`:''}<div class="small dim">± ${jam(menitItem(x))}, ${x.durasi||15} menit</div>` : `${x.mulai}–${x.selesai}`;

    const belum = kebiasaanTanpaJadwal();
    isi = (belum.length ? `<div class="c12 panel" style="border-color:rgba(227,178,90,.35)"><h2>Kebiasaan belum dijadwalkan <span class="pill warn">${belum.length}</span></h2>
      <div class="small dim" style="margin-bottom:10px">Aturan harian ini hanya bisa dicentang di Beranda. Beri jam supaya muncul di jadwal dan bisa dicentang dari sana.</div>
      <div class="row" style="flex-wrap:wrap;gap:8px">${belum.map(a => `<button class="btn sm" data-act="aturan-edit" data-id="${a.id}">${esc(a.nama)} · jadwalkan</button>`).join('')}</div></div>` : '') +
    `<div class="c12 panel"><h2>Rutinitas <button class="btn sm primary" data-act="jadwal-tambah">Tambah kegiatan</button></h2>
      <div class="scroll"><table class="tbl"><thead><tr><th>Jam</th><th>Kegiatan</th><th>Jenis</th><th>Hari</th><th>Dicek dari</th><th></th></tr></thead><tbody>${items.map(x => `<tr><td class="mono" style="white-space:nowrap">${jamItem(x)}</td><td><b>${esc(x.judul)}</b>${x.ket?`<div class="small muted">${esc(x.ket)}</div>`:''}</td><td><span class="pill" style="color:${WARNA[x.jenis]}">${JENIS[x.jenis]||x.jenis}</span></td><td><div class="chips">${[1,2,3,4,5,6,0].map(d => `<span class="${(x.hari||[]).includes(d)?'on':''}">${HARI[d].slice(0,2)}</span>`).join('')}</div></td><td class="small muted">${esc(tautan[x.link||'']||'—')}</td><td class="num" style="white-space:nowrap"><button class="btn sm ghost" data-act="jadwal-edit" data-id="${x.id}">Ubah</button><button class="btn sm ghost" data-act="jadwal-hapus" data-id="${x.id}">Hapus</button></td></tr>`).join('') || '<tr><td colspan="6" class="dim">Belum ada rutinitas.</td></tr>'}</tbody></table></div>
      <div class="small dim" style="margin-top:10px">Sholat (jam kotamu), kuliah, dan rencana DCA tidak perlu ditambahkan di sini karena masuk otomatis. Kegiatan yang ditautkan akan dicek selesai/belum secara otomatis.</div></div>`;
  }

    <div class="row">${tabs}</div></div>

    <div class="c3">${tile('Kuliah per minggu', (S.kuliah.items||[]).length + ' sesi', `${Math.floor(sks/60)} jam ${sks%60} menit di kelas`, 'teal')}</div>
    <div class="c3">${tile('Rutinitas', (S.jadwal.items||[]).length, 'kegiatan yang kamu atur', '')}</div>
    <div class="c3">${tile('Bentrok', bentrok, bentrok ? 'kegiatan dengan jam bertabrakan, cek yang bertanda merah' : 'tidak ada jam bertabrakan', bentrok?'bad':'good')}</div>
    ${isi}
  </div>`;
}
function modalJadwal(x){
  const baru = !x; x = x || { id:uid(), judul:'', jenis:'kebiasaan', hari:[1,2,3,4,5,6,0], mulai:'08:00', selesai:'09:00', link:'', ket:'' };
  modal(`<h3>${baru ? 'Kegiatan baru' : 'Ubah kegiatan'}</h3><div class="desc">Tautkan ke kebiasaan kalau ingin dicentang langsung dari jadwal.</div>

  <div class="form cols2">${F('Mulai (jam tetap)', `<input type="time" name="mulai" value="${x.mulai||'08:00'}">`)}${F('Selesai (jam tetap)', `<input type="time" name="selesai" value="${x.selesai||'09:00'}">`)}
  ${F('Jeda setelah sholat (menit)', `<input type="number" name="jeda" min="0" max="180" value="${+x.jeda||0}">`)}${F('Lama (menit)', `<input type="number" name="durasi" min="5" max="300" value="${+x.durasi||15}">`)}</div>
  <div class="small dim">Jam tetap memakai Mulai–Selesai. "Setelah sholat" memakai Jeda dan Lama, dan otomatis digeser kalau jatuh di jam kuliah.</div>
  ${F('Catatan', `<input type="text" name="ket" value="${esc(x.ket||'')}" placeholder="opsional">`)}${ACTIONS()}</form>`,
  async (d, fd) => { const hariDipilih = fd.getAll('hari').map(Number); if (!hariDipilih.length) { toast('Pilih minimal satu hari', true); return false; }

    const list = S.jadwal.items = S.jadwal.items||[]; const i = list.findIndex(y => y.id===x.id); if (i>=0) list[i] = obj; else list.push(obj);
